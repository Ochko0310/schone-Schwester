<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Silkscreen:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #f3e3c4;
    --paper: #e6d2ab;
    --paper-2: #d8c094;
    --ink: #2a1418;
    --ink-soft: #4a2630;
    --maroon: #6b1d34;
    --maroon-deep: #3a0f1c;
    --pink: #ff5c8a;
    --pink-hot: #ff2d6a;
    --teal: #2d8a8a;
    --teal-deep: #1a5454;
    --label: #f4d96a;
    --label-shadow: #c9a93b;
    --crt: #0c1a14;
    --crt-glow: #8effc1;
    --shadow: rgba(42, 20, 24, 0.22);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: var(--cream);
    color: var(--ink);
    font-family: 'VT323', 'Courier New', monospace;
    font-size: 22px;
    line-height: 1.35;
    image-rendering: pixelated;
    -webkit-font-smoothing: none;
    overflow-x: hidden;
  }
  body {
    background:
      repeating-linear-gradient(0deg, rgba(42,20,24,0.05) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse 90% 70% at 50% 30%, var(--cream) 0%, var(--paper) 60%, var(--paper-2) 100%);
    background-attachment: fixed;
    padding:
      calc(20px + env(safe-area-inset-top, 0px))
      calc(16px + env(safe-area-inset-right, 0px))
      calc(60px + env(safe-area-inset-bottom, 0px))
      calc(16px + env(safe-area-inset-left, 0px));
  }
  /* Decorative paper grain */
  body::before {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 12% 18%, rgba(106,29,52,0.07) 0 2px, transparent 3px),
      radial-gradient(circle at 78% 62%, rgba(106,29,52,0.05) 0 2px, transparent 3px),
      radial-gradient(circle at 35% 88%, rgba(106,29,52,0.06) 0 2px, transparent 3px),
      radial-gradient(circle at 92% 22%, rgba(106,29,52,0.05) 0 2px, transparent 3px);
    background-size: 280px 280px;
    mix-blend-mode: multiply;
    opacity: .6;
  }

  .pixel-h { font-family: 'Press Start 2P', monospace; letter-spacing: 0.5px; }
  .silk { font-family: 'Silkscreen', monospace; }

  /* ============== WINDOW CHROME ============== */
  .stage {
    max-width: 880px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .window {
    background: var(--cream);
    border: 3px solid var(--ink);
    box-shadow:
      6px 6px 0 0 var(--ink),
      6px 6px 0 3px var(--maroon);
    position: relative;
  }
  .window-bar {
    background: var(--maroon);
    color: var(--label);
    border-bottom: 3px solid var(--ink);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    letter-spacing: 1px;
  }
  .window-bar .dots {
    display: flex; gap: 6px;
  }
  .window-bar .dot {
    width: 12px; height: 12px;
    border: 2px solid var(--ink);
    background: var(--label);
  }
  .window-bar .dot.b { background: var(--pink); }
  .window-bar .dot.c { background: var(--teal); }
  .window-bar .title {
    flex: 1;
    text-align: center;
    text-transform: uppercase;
  }
  .window-bar .x {
    width: 22px; height: 22px;
    border: 2px solid var(--ink);
    background: var(--cream);
    color: var(--ink);
    display: grid; place-items: center;
    font-size: 11px;
  }

  .window-body {
    padding: 28px 28px 32px;
  }

  /* ============== HEADER STRIP ============== */
  .header-strip {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 14px;
    align-items: center;
    padding-bottom: 18px;
    margin-bottom: 24px;
    border-bottom: 3px dashed var(--ink);
  }
  .header-strip .lab {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    text-transform: uppercase;
    color: var(--maroon);
    letter-spacing: 1px;
  }
  .header-strip .lab.right { text-align: right; }
  .header-strip .lab b {
    display: block;
    font-size: 14px;
    color: var(--ink);
    margin-top: 6px;
    letter-spacing: 1.5px;
  }
  .header-strip .stamp {
    transform: rotate(-6deg);
    border: 3px solid var(--maroon);
    color: var(--maroon);
    padding: 6px 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    background: rgba(255,255,255,0.15);
    box-shadow: inset 0 0 0 2px var(--cream);
  }

  /* ============== CASSETTE ============== */
  .cassette-wrap {
    perspective: 1400px;
    display: flex;
    justify-content: center;
    margin: 10px auto 20px;
  }
  .cassette-flipper {
    position: relative;
    width: 100%;
    max-width: 540px;
    aspect-ratio: 540 / 340;
    transform-style: preserve-3d;
    transition: transform 1.1s cubic-bezier(.65,.05,.36,1);
    cursor: pointer;
  }
  .cassette-flipper.flipped {
    transform: rotateY(180deg);
  }
  .cassette-side {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .cassette-side.b {
    transform: rotateY(180deg);
  }
  .cassette-svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(8px 10px 0 rgba(42,20,24,0.25));
  }

  /* Reel spin animation */
  @keyframes reel-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .reel {
    transform-origin: center;
    transform-box: fill-box;
  }
  .playing .reel {
    animation: reel-spin 2.2s linear infinite;
  }

  /* Tape strip subtle wobble */
  @keyframes tape-flutter {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(0.6px); }
  }
  .playing .tape-strip {
    animation: tape-flutter 0.4s ease-in-out infinite;
  }

  /* ============== CONTROLS ============== */
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: stretch;
    margin: 6px 0 28px;
    flex-wrap: wrap;
  }
  .ctrl {
    background: var(--ink);
    color: var(--cream);
    border: 3px solid var(--ink);
    padding: 12px 18px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    cursor: pointer;
    box-shadow: 4px 4px 0 0 var(--maroon);
    transition: transform .08s ease, box-shadow .08s ease, background .15s;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .ctrl:hover { background: var(--maroon); box-shadow: 4px 4px 0 0 var(--ink); }
  .ctrl:active, .ctrl.active {
    transform: translate(4px, 4px);
    box-shadow: 0 0 0 0 var(--maroon);
  }
  .ctrl.active { background: var(--pink-hot); color: var(--cream); }
  .ctrl .ico {
    display: inline-block;
    width: 14px;
    text-align: center;
  }

  /* VU Meter */
  .vu {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 28px;
    padding: 4px 8px;
    background: var(--crt);
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 0 var(--maroon);
  }
  .vu-bar {
    width: 5px;
    background: var(--crt-glow);
    height: 30%;
    transition: height .15s ease;
  }
  .vu-bar.warn { background: var(--label); }
  .vu-bar.hot { background: var(--pink-hot); }

  /* ============== CRT TRACKLIST ============== */
  .crt {
    background: var(--crt);
    border: 3px solid var(--ink);
    box-shadow:
      inset 0 0 40px rgba(0,0,0,0.6),
      6px 6px 0 0 var(--maroon);
    color: var(--crt-glow);
    padding: 22px 24px 24px;
    position: relative;
    overflow: hidden;
    margin-bottom: 28px;
  }
  .crt::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.04) 0 1px,
      transparent 1px 3px
    );
    pointer-events: none;
  }
  .crt::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
    pointer-events: none;
  }
  .crt-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    padding-bottom: 12px;
    margin-bottom: 14px;
    border-bottom: 2px dashed rgba(142, 255, 193, 0.4);
    position: relative; z-index: 1;
  }
  .crt-head .blink {
    animation: blink 1.1s steps(2) infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  .tracklist {
    list-style: none;
    margin: 0; padding: 0;
    font-size: 24px;
    position: relative; z-index: 1;
  }
  .track {
    display: grid;
    grid-template-columns: 38px 1fr auto;
    align-items: baseline;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px dotted rgba(142, 255, 193, 0.25);
    line-height: 1.2;
    opacity: 0;
    transform: translateX(-6px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .track.shown { opacity: 1; transform: translateX(0); }
  .track .num {
    color: var(--label);
    font-family: 'Silkscreen', monospace;
    font-size: 16px;
  }
  .track .name {
    color: var(--crt-glow);
  }
  .track .name .sub {
    display: block;
    color: rgba(142, 255, 193, 0.55);
    font-size: 18px;
    margin-top: 2px;
    font-style: italic;
  }
  .track .dur {
    color: var(--label);
    font-family: 'Silkscreen', monospace;
    font-size: 16px;
    white-space: nowrap;
  }
  .track.current .name {
    color: #fff;
    text-shadow: 0 0 8px var(--crt-glow);
  }
  .track.current::before {
    content: '▶';
    position: absolute;
    margin-left: -20px;
    color: var(--pink-hot);
    text-shadow: 0 0 6px var(--pink);
    animation: blink 0.6s steps(2) infinite;
  }
  .track-line { position: relative; }

  /* Side B special track */
  .side-b-msg {
    margin-top: 14px;
    padding: 18px 20px 20px;
    border: 2px dashed var(--crt-glow);
    background: rgba(142, 255, 193, 0.06);
    color: #fff;
    font-size: 26px;
    line-height: 1.55;
    position: relative; z-index: 1;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .8s ease .3s, transform .8s ease .3s;
  }
  .side-b-msg.shown { opacity: 1; transform: translateY(0); }
  .side-b-msg .corner {
    position: absolute;
    color: var(--pink);
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    letter-spacing: 1px;
  }
  .side-b-msg .corner.tl { top: -10px; left: 14px; background: var(--crt); padding: 0 6px; }
  .side-b-msg .corner.br { bottom: -10px; right: 14px; background: var(--crt); padding: 0 6px; color: var(--label); }

  /* ============== STICKERS / DECOR ============== */
  .sticker {
    position: absolute;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    padding: 6px 8px;
    border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    background: var(--label);
    letter-spacing: 1px;
    text-transform: uppercase;
    z-index: 2;
  }
  .sticker.pink { background: var(--pink); color: var(--cream); }
  .sticker.teal { background: var(--teal); color: var(--cream); }

  /* Pixel heart */
  .heart {
    display: inline-block;
    width: 16px; height: 14px;
    position: relative;
    image-rendering: pixelated;
    background:
      /* row 1 */
      linear-gradient(var(--pink-hot), var(--pink-hot)) 2px 0/2px 2px no-repeat,
      linear-gradient(var(--pink-hot), var(--pink-hot)) 4px 0/2px 2px no-repeat,
      linear-gradient(var(--pink-hot), var(--pink-hot)) 10px 0/2px 2px no-repeat,
      linear-gradient(var(--pink-hot), var(--pink-hot)) 12px 0/2px 2px no-repeat,
      /* row 2 */
      linear-gradient(var(--pink-hot), var(--pink-hot)) 0 2px/16px 2px no-repeat,
      /* row 3 */
      linear-gradient(var(--pink-hot), var(--pink-hot)) 0 4px/16px 2px no-repeat,
      /* row 4 */
      linear-gradient(var(--pink-hot), var(--pink-hot)) 2px 6px/12px 2px no-repeat,
      /* row 5 */
      linear-gradient(var(--pink-hot), var(--pink-hot)) 4px 8px/8px 2px no-repeat,
      /* row 6 */
      linear-gradient(var(--pink-hot), var(--pink-hot)) 6px 10px/4px 2px no-repeat;
  }
  .heart.beat {
    animation: heartbeat 1.2s ease-in-out infinite;
  }
  @keyframes heartbeat {
    0%, 70%, 100% { transform: scale(1); }
    20% { transform: scale(1.25); }
    40% { transform: scale(1.1); }
  }

  /* ============== LINER NOTES ============== */
  .liner {
    margin-top: 8px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 22px;
  }
  @media (min-width: 720px) {
    .liner { grid-template-columns: 1.1fr 1fr; }
  }
  .note-card {
    background: var(--cream);
    border: 3px solid var(--ink);
    padding: 18px 20px;
    position: relative;
    box-shadow: 5px 5px 0 var(--ink);
  }
  .note-card.pink {
    background: #ffe9ee;
  }
  .note-card.teal {
    background: #d8ebeb;
  }
  .note-card .label {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--maroon);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .note-card .body {
    font-size: 22px;
    color: var(--ink);
    line-height: 1.5;
  }
  .note-card .body em {
    font-style: italic;
    color: var(--maroon);
  }
  .note-card.tape::before {
    content: '';
    position: absolute;
    width: 70px; height: 18px;
    background: rgba(244, 217, 106, 0.7);
    border: 1px solid rgba(0,0,0,0.15);
    top: -14px; left: 24px;
    transform: rotate(-3deg);
    box-shadow: 2px 2px 0 rgba(0,0,0,0.08);
  }
  .note-card.tape.r::before {
    left: auto; right: 24px;
    transform: rotate(4deg);
  }

  /* Signoff */
  .signoff {
    margin-top: 28px;
    padding-top: 22px;
    border-top: 3px dashed var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
  }
  .signoff .floppy {
    width: 110px; height: 110px;
  }
  .signoff .sig {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--maroon);
  }
  .signoff .date {
    font-family: 'Silkscreen', monospace;
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 1px;
  }

  /* Tiny stars sparkle */
  .stars { position: absolute; pointer-events: none; inset: 0; overflow: hidden; }
  .star {
    position: absolute;
    width: 6px; height: 6px;
    background:
      linear-gradient(var(--maroon), var(--maroon)) 2px 0/2px 6px no-repeat,
      linear-gradient(var(--maroon), var(--maroon)) 0 2px/6px 2px no-repeat;
    opacity: .55;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 0.8; transform: scale(1.1); }
  }

  /* ============== ARCHIVE / COUNTERS / MAP ============== */
  .section-head {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 36px 0 18px;
  }
  .section-head .line { flex: 1; height: 3px; background: var(--ink); }
  .section-head .title {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--maroon);
    background: var(--cream);
    padding: 0 6px;
  }

  .counters {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
    margin-bottom: 22px;
  }
  @media (min-width: 720px) {
    .counters { grid-template-columns: repeat(3, 1fr); }
  }
  .counter {
    background: var(--crt);
    border: 3px solid var(--ink);
    box-shadow: 5px 5px 0 var(--ink);
    padding: 16px 18px 16px;
    color: var(--crt-glow);
    position: relative;
    overflow: hidden;
  }
  .counter::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 3px);
    pointer-events: none;
  }
  .counter::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.45) 100%);
    pointer-events: none;
  }
  .counter .ctr-lbl {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    letter-spacing: 1.2px;
    color: var(--label);
    margin-bottom: 14px;
    position: relative; z-index: 1;
    text-transform: uppercase;
  }
  .counter .ctr-lbl .blink { animation: blink 1.1s steps(2) infinite; }
  .counter .big {
    font-family: 'Press Start 2P', monospace;
    font-size: 20px;
    letter-spacing: 1px;
    color: var(--crt-glow);
    text-shadow: 0 0 10px rgba(142, 255, 193, 0.55);
    margin-bottom: 8px;
    position: relative; z-index: 1;
    line-height: 1.2;
  }
  .counter.pink .big { color: #ff7da5; text-shadow: 0 0 10px rgba(255, 92, 138, 0.65); }
  .counter.yellow .big { color: var(--label); text-shadow: 0 0 10px rgba(244, 217, 106, 0.65); }
  .counter .time {
    font-family: 'Silkscreen', monospace;
    font-size: 28px;
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.92);
    margin-bottom: 10px;
    position: relative; z-index: 1;
    font-weight: 700;
  }
  .counter.pink .time { color: rgba(255, 200, 215, 0.95); }
  .counter.yellow .time { color: rgba(255, 240, 180, 0.95); }
  .counter .sub {
    font-family: 'Silkscreen', monospace;
    font-size: 12px;
    color: rgba(244, 217, 106, 0.75);
    letter-spacing: 1px;
    position: relative; z-index: 1;
  }
  .counter .led {
    position: absolute;
    top: 12px; right: 14px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--pink-hot);
    box-shadow: 0 0 8px var(--pink-hot);
    animation: blink 1.4s steps(2) infinite;
  }

  /* MAP CARD (Google Maps style) */
  .map-card {
    background: #fff;
    border: 3px solid var(--ink);
    box-shadow: 6px 6px 0 var(--maroon);
    padding: 0;
    position: relative;
    overflow: hidden;
    margin-bottom: 28px;
    font-family: 'Roboto', system-ui, sans-serif;
  }
  .map-toolbar {
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    padding: 10px 12px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .map-search {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f1f3f4;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    color: #3c4043;
    min-width: 0;
  }
  .map-search .gicon {
    color: #1a73e8;
    font-weight: 700;
    font-size: 14px;
    flex-shrink: 0;
  }
  .map-search .route {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 500;
  }
  .map-search .route .from { color: #1a73e8; }
  .map-search .route .arr { margin: 0 6px; color: #5f6368; }
  .map-search .route .to { color: #ea4335; }
  .map-route-pill {
    background: #1a73e8;
    color: white;
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .map-svg-wrap {
    position: relative;
    background: #e8e6e1;
    line-height: 0;
  }
  .map-svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .map-zoom {
    position: absolute;
    top: 14px;
    right: 14px;
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,.18);
    overflow: hidden;
    z-index: 2;
  }
  .map-zoom button {
    display: block;
    width: 30px;
    height: 30px;
    background: none;
    border: none;
    border-bottom: 1px solid #e0e0e0;
    cursor: pointer;
    font-size: 18px;
    color: #5f6368;
    font-family: 'Roboto', sans-serif;
    line-height: 1;
  }
  .map-zoom button:last-child { border-bottom: none; }
  .map-zoom button:hover { background: #f1f3f4; }
  .map-distance-pill {
    position: absolute;
    bottom: 16px;
    left: 16px;
    background: #fff;
    border-radius: 999px;
    padding: 10px 16px;
    font-family: 'Roboto', sans-serif;
    font-size: 13px;
    color: #202124;
    font-weight: 500;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 2;
  }
  .map-distance-pill .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ea4335;
  }
  .map-distance-pill b {
    color: #1a73e8;
    font-weight: 700;
  }
  .map-attribution {
    position: absolute;
    bottom: 6px;
    right: 10px;
    font-family: 'Roboto', sans-serif;
    font-size: 10px;
    color: #5f6368;
    background: rgba(255,255,255,0.7);
    padding: 2px 6px;
    z-index: 2;
  }
  .map-foot {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin: 0;
    padding: 14px 18px;
    border-top: 1px solid #e0e0e0;
    background: #fafafa;
    position: relative; z-index: 1;
    font-family: 'Roboto', sans-serif;
    font-size: 14px;
  }
  .map-foot .cell {
    color: #202124;
    font-weight: 500;
  }
  .map-foot .cell b {
    display: block;
    color: #5f6368;
    font-family: 'Roboto', sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 4px;
  }

  @keyframes dash-flow {
    to { stroke-dashoffset: -20; }
  }
  .heart-line {
    animation: dash-flow 1.5s linear infinite;
  }
  @keyframes mini-beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .map-heart {
    transform-origin: center;
    transform-box: fill-box;
    animation: mini-beat 1.1s ease-in-out infinite;
  }
  @keyframes pin-drop {
    0% { transform: translateY(-30px); opacity: 0; }
    60% { transform: translateY(4px); opacity: 1; }
    100% { transform: translateY(0); opacity: 1; }
  }
  .pin {
    transform-origin: center bottom;
    transform-box: fill-box;
    animation: pin-drop 0.7s cubic-bezier(.5,1.5,.5,1) both;
  }

  /* ============== GAMES IFRAME ============== */
  .games-frame-card {
    background: var(--ink);
    border: 3px solid var(--ink);
    box-shadow: 6px 6px 0 var(--maroon);
    overflow: hidden;
    margin-bottom: 28px;
    position: relative;
  }
  .games-frame-head {
    background: var(--maroon);
    color: var(--label);
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    border-bottom: 3px solid var(--ink);
  }
  .games-frame-head .blink { animation: blink 1.1s steps(2) infinite; color: var(--pink-hot); }
  .games-frame {
    width: 100%;
    height: 900px;
    border: none;
    display: block;
    background: #ffe6f2;
  }
  @media (max-width: 560px) {
    .games-frame { height: 1000px; }
  }

  /* ============== GAME ============== */
  .game-card {
    background: #150810;
    border: 3px solid var(--ink);
    box-shadow: 6px 6px 0 var(--maroon);
    padding: 18px 18px 16px;
    position: relative;
    overflow: hidden;
    margin-bottom: 28px;
    color: var(--label);
  }
  .game-card::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 3px);
    pointer-events: none;
  }
  .game-head {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--label);
    letter-spacing: 1.5px;
    margin-bottom: 12px;
    border-bottom: 2px dashed rgba(244, 217, 106, 0.35);
    padding-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative; z-index: 1;
  }
  .game-head .blink { animation: blink 1.1s steps(2) infinite; color: var(--pink-hot); }
  .game-stage {
    position: relative;
    background: var(--crt);
    border: 3px solid var(--ink);
    padding: 0;
    display: grid;
    place-items: center;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .game-stage canvas {
    width: 100%;
    max-width: 520px;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    touch-action: none;
    cursor: crosshair;
  }
  .game-stage .start-overlay {
    position: absolute;
    inset: 0;
    background: rgba(12, 26, 20, 0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 2;
  }
  .game-stage .start-overlay h3 {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--pink);
    margin: 0;
    text-shadow: 0 0 8px rgba(255, 92, 138, 0.6);
  }
  .game-stage .start-overlay p {
    font-family: 'VT323', monospace;
    font-size: 20px;
    color: var(--crt-glow);
    margin: 0;
    text-align: center;
    max-width: 320px;
    line-height: 1.4;
  }
  .game-stage .start-overlay button {
    background: var(--pink-hot);
    color: white;
    border: 3px solid white;
    box-shadow: 4px 4px 0 var(--ink);
    padding: 12px 18px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    cursor: pointer;
    text-transform: uppercase;
    transition: transform .08s, box-shadow .08s;
  }
  .game-stage .start-overlay button:active {
    transform: translate(4px, 4px);
    box-shadow: 0 0 0 var(--ink);
  }
  .game-hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--crt-glow);
    margin-bottom: 14px;
    flex-wrap: wrap;
    position: relative; z-index: 1;
  }
  .game-hud .pill {
    background: rgba(142, 255, 193, 0.1);
    padding: 6px 10px;
    border: 1px solid rgba(142, 255, 193, 0.35);
  }
  .game-hud .pill.pink { background: rgba(255, 92, 138, 0.12); border-color: rgba(255, 92, 138, 0.4); color: var(--pink); }
  .game-hud button {
    background: var(--pink-hot);
    color: white;
    border: 3px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    padding: 8px 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    letter-spacing: 1.2px;
    cursor: pointer;
    text-transform: uppercase;
  }
  .game-hud button:hover { background: var(--pink); }
  .game-msgs {
    min-height: 30px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 10px;
    position: relative; z-index: 1;
  }
  .game-msg {
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: #ffdfe8;
    background: rgba(255, 92, 138, 0.12);
    border-left: 3px solid var(--pink);
    padding: 6px 12px;
    animation: msg-in 0.7s ease;
  }
  .game-msg .tag {
    color: var(--label);
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    letter-spacing: 1.5px;
    margin-right: 8px;
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .game-keys {
    text-align: center;
    font-family: 'Silkscreen', monospace;
    font-size: 13px;
    color: rgba(244, 217, 106, 0.65);
    letter-spacing: 1.5px;
    position: relative; z-index: 1;
  }

  /* ============== VINYL PLAYER ============== */
  .vinyl-section {
    margin-bottom: 26px;
  }
  .turntable {
    position: relative;
    background:
      linear-gradient(155deg, #2a181f 0%, #160a10 100%);
    border: 3px solid var(--ink);
    box-shadow: 6px 6px 0 var(--maroon);
    padding: 22px 22px 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    align-items: center;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .turntable::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 20% 0%, rgba(255,255,255,0.06) 0%, transparent 50%);
    pointer-events: none;
  }
  @media (max-width: 640px) {
    .turntable { grid-template-columns: 1fr; gap: 14px; padding: 16px 14px 18px; }
  }
  .turntable-deck {
    position: relative;
    aspect-ratio: 1;
    width: 100%;
    max-width: 360px;
    margin: 0 auto;
  }
  .vinyl-disc-wrap {
    width: 100%;
    height: 100%;
    position: relative;
    z-index: 1;
  }
  .vinyl-disc-wrap.spinning {
    animation: vinyl-spin 2.5s linear infinite;
  }
  @keyframes vinyl-spin {
    to { transform: rotate(360deg); }
  }
  .vinyl-disc {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(4px 4px 0 rgba(0, 0, 0, 0.45));
  }
  .tonearm-wrap {
    position: absolute;
    top: -4%;
    right: -4%;
    width: 60%;
    height: 60%;
    pointer-events: none;
    transform-origin: 80% 20%;
    transform: rotate(-18deg);
    transition: transform 0.9s cubic-bezier(.55, 0, .35, 1);
    z-index: 2;
  }
  .turntable-deck.engaged .tonearm-wrap {
    transform: rotate(6deg);
  }
  .tonearm-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .vinyl-info {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
    color: var(--cream);
    position: relative;
    z-index: 1;
  }
  .now-playing-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    letter-spacing: 1.8px;
    color: var(--label);
    margin-bottom: 8px;
  }
  .now-playing-label .blink { animation: blink 1.1s steps(2) infinite; }
  .now-playing-title {
    font-family: 'VT323', monospace;
    font-size: 28px;
    color: var(--cream);
    line-height: 1.15;
    word-break: break-word;
  }
  .now-playing-artist {
    font-family: 'Silkscreen', monospace;
    font-size: 13px;
    color: rgba(244, 217, 106, 0.75);
    letter-spacing: 1.2px;
    margin-top: 6px;
  }
  .vinyl-status {
    font-family: 'Silkscreen', monospace;
    font-size: 13px;
    letter-spacing: 1.5px;
    color: var(--pink);
  }
  .vinyl-status.idle { color: rgba(244, 217, 106, 0.6); }
  .vinyl-controls {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .vinyl-play {
    background: var(--pink-hot);
    color: white;
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 0 var(--ink);
    padding: 13px 22px;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    text-transform: uppercase;
    transition: transform .08s, box-shadow .08s, background .15s;
  }
  .vinyl-play:hover { background: var(--pink); }
  .vinyl-play:active {
    transform: translate(4px, 4px);
    box-shadow: 0 0 0 0 var(--ink);
  }

  /* Source picker */
  .source-picker {
    background: var(--cream);
    border: 3px solid var(--ink);
    box-shadow: 5px 5px 0 var(--maroon);
    overflow: hidden;
  }
  .source-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-bottom: 3px solid var(--ink);
  }
  .source-tab {
    background: var(--paper);
    border: none;
    border-right: 2px solid var(--ink);
    padding: 13px 10px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    letter-spacing: 1.2px;
    cursor: pointer;
    color: var(--ink);
    text-transform: uppercase;
    transition: background 0.15s, color 0.15s;
  }
  .source-tab:last-child { border-right: none; }
  .source-tab.active {
    background: var(--maroon);
    color: var(--label);
  }
  .source-tab:not(.active):hover { background: var(--label); }
  .source-content { padding: 18px 20px; }
  .field-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: stretch;
  }
  .field-row .grow { flex: 1; min-width: 200px; }
  .text-input {
    background: #fffaeb;
    border: 2px solid var(--ink);
    padding: 10px 12px;
    font-family: 'VT323', monospace;
    font-size: 20px;
    color: var(--ink);
    outline: none;
    width: 100%;
    box-sizing: border-box;
  }
  .text-input:focus { background: #fff; border-color: var(--maroon); }
  .btn {
    background: var(--ink);
    color: var(--cream);
    border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 var(--maroon);
    padding: 10px 14px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    letter-spacing: 1.2px;
    cursor: pointer;
    text-transform: uppercase;
    transition: transform .08s, box-shadow .08s, background .15s;
  }
  .btn:hover { background: var(--maroon); }
  .btn:active {
    transform: translate(3px, 3px);
    box-shadow: 0 0 0 var(--maroon);
  }
  .btn.pink { background: var(--pink-hot); }
  .btn.pink:hover { background: var(--pink); }
  .btn.outline {
    background: var(--cream);
    color: var(--ink);
  }
  .btn.outline:hover { background: var(--paper); }
  .hint {
    font-family: 'Silkscreen', monospace;
    font-size: 11px;
    color: var(--maroon);
    letter-spacing: 0.5px;
    margin-top: 10px;
    opacity: 0.8;
  }
  .file-zone {
    border: 2px dashed var(--ink);
    padding: 22px 18px;
    text-align: center;
    background: var(--paper);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    display: block;
  }
  .file-zone:hover {
    background: var(--label);
    border-color: var(--maroon);
  }
  .file-zone .main {
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: var(--ink);
  }
  .file-zone .small {
    font-family: 'Silkscreen', monospace;
    font-size: 11px;
    color: var(--maroon);
    margin-top: 8px;
    opacity: 0.75;
  }
  .record-zone {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .record-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 4px solid var(--ink);
    background: var(--pink-hot);
    box-shadow: 4px 4px 0 var(--maroon);
    cursor: pointer;
    display: grid;
    place-items: center;
    color: white;
    font-size: 22px;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .record-btn:hover { background: var(--pink); }
  .record-btn.recording {
    background: #ff2030;
    animation: rec-pulse 1.2s ease-in-out infinite;
  }
  @keyframes rec-pulse {
    0%, 100% { box-shadow: 4px 4px 0 var(--maroon), 0 0 0 0 rgba(255, 32, 48, 0.4); }
    50% { box-shadow: 4px 4px 0 var(--maroon), 0 0 0 12px rgba(255, 32, 48, 0); }
  }
  .record-info {
    flex: 1;
    min-width: 0;
  }
  .record-status {
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: var(--ink);
    line-height: 1.2;
  }
  .field-error {
    margin-top: 12px;
    padding: 10px 14px;
    background: rgba(255, 92, 138, 0.13);
    border-left: 3px solid var(--pink-hot);
    color: var(--maroon);
    font-family: 'VT323', monospace;
    font-size: 18px;
  }
  .yt-host {
    position: absolute;
    width: 1px; height: 1px;
    left: -9999px; top: -9999px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
  }

  /* SECRET LETTER */
  .letter-card {
    margin-top: 22px;
    margin-bottom: 6px;
  }
  .envelope {
    width: 100%;
    background: var(--cream);
    border: 3px solid var(--ink);
    box-shadow: 5px 5px 0 var(--maroon);
    padding: 26px 22px;
    cursor: pointer;
    text-align: center;
    position: relative;
    font-family: 'VT323', monospace;
    transition: transform 0.15s, box-shadow 0.15s;
    color: var(--ink);
  }
  .envelope:hover { transform: translate(-1px, -1px); box-shadow: 6px 6px 0 var(--maroon); }
  .envelope:active { transform: translate(2px, 2px); box-shadow: 3px 3px 0 var(--maroon); }
  .envelope .seal {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--pink-hot);
    border: 3px solid var(--ink);
    display: grid;
    place-items: center;
    color: white;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    box-shadow: 2px 2px 0 var(--maroon);
  }
  .envelope .to {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--maroon);
    letter-spacing: 1.5px;
    margin: 12px 0 8px;
  }
  .envelope .title {
    font-family: 'VT323', monospace;
    font-size: 28px;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .envelope .hint-open {
    font-family: 'Silkscreen', monospace;
    font-size: 12px;
    color: var(--maroon);
    letter-spacing: 1.5px;
    margin-top: 12px;
  }
  .envelope .hint-open .blink { animation: blink 1.1s steps(2) infinite; }
  .letter-inside {
    background: #fff8e4;
    border: 3px solid var(--ink);
    box-shadow: 5px 5px 0 var(--maroon);
    padding: 28px 28px 26px;
    position: relative;
    color: var(--ink);
    animation: letter-open 0.5s cubic-bezier(.5,1.5,.5,1);
  }
  @keyframes letter-open {
    from { transform: scale(0.95) translateY(-8px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  .letter-inside::before {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px dashed rgba(106, 29, 52, 0.4);
    pointer-events: none;
  }
  .letter-inside .head {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--maroon);
    margin-bottom: 14px;
    text-align: center;
  }
  .letter-inside .body {
    font-family: 'VT323', monospace;
    font-size: 26px;
    line-height: 1.5;
    color: var(--ink);
    text-align: center;
    margin: 14px 0;
  }
  .letter-inside .sign {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--maroon);
    text-align: right;
    margin-top: 14px;
  }

  /* ============== VINYL PLAYER ============== */
  .vinyl-card {
    background: linear-gradient(180deg, #4a2630 0%, #2a141a 100%);
    border: 3px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
    overflow: hidden;
    margin: 0 0 28px;
    position: relative;
    color: var(--cream);
  }
  .vinyl-deck {
    padding: 28px 24px 22px;
    background:
      radial-gradient(ellipse 80% 60% at 50% 50%, rgba(255,255,255,0.04) 0%, transparent 70%),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 2px, transparent 2px 6px),
      linear-gradient(180deg, #3a1f2e 0%, #1a0a12 100%);
    position: relative;
  }
  .vinyl-platter-wrap {
    position: relative;
    width: min(320px, 100%);
    aspect-ratio: 1;
    margin: 0 auto 18px;
  }
  .vinyl-platter {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    box-shadow:
      0 8px 24px rgba(0,0,0,0.6),
      inset 0 0 30px rgba(0,0,0,0.5);
  }
  .vinyl-svg {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 50%;
  }
  @keyframes vinyl-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .vinyl-platter.spinning .vinyl-svg {
    animation: vinyl-spin 2s linear infinite;
  }

  .tonearm-wrap {
    position: absolute;
    top: -6%;
    right: -6%;
    width: 60%;
    height: 60%;
    pointer-events: none;
    transition: transform .9s cubic-bezier(.65,.05,.36,1);
    transform-origin: 85% 15%;
    transform: rotate(-20deg);
    z-index: 3;
    filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.5));
  }
  .tonearm-wrap.on {
    transform: rotate(2deg);
  }

  .vinyl-play-btn {
    position: absolute;
    left: 50%;
    bottom: -22px;
    transform: translateX(-50%);
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--pink-hot);
    color: white;
    border: 4px solid var(--cream);
    box-shadow: 0 4px 0 var(--ink), 0 6px 14px rgba(0,0,0,0.5);
    font-size: 22px;
    font-family: 'Press Start 2P', monospace;
    cursor: pointer;
    z-index: 4;
    transition: transform .08s, box-shadow .08s, background .15s;
    line-height: 1;
    padding: 0;
  }
  .vinyl-play-btn:hover:not(:disabled) { background: var(--pink); }
  .vinyl-play-btn:active:not(:disabled) {
    transform: translateX(-50%) translateY(2px);
    box-shadow: 0 2px 0 var(--ink), 0 4px 10px rgba(0,0,0,0.5);
  }
  .vinyl-play-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .vinyl-track-info {
    text-align: center;
    margin-top: 28px;
    padding: 14px 16px 10px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(244, 217, 106, 0.25);
  }
  .vinyl-track-info .now {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--label);
    letter-spacing: 1.5px;
    margin-bottom: 8px;
  }
  .vinyl-track-info .title {
    font-family: 'VT323', monospace;
    font-size: 26px;
    color: var(--cream);
    line-height: 1.2;
    margin-bottom: 6px;
    min-height: 30px;
    word-break: break-word;
  }
  .vinyl-track-info .time {
    font-family: 'Silkscreen', monospace;
    font-size: 14px;
    color: var(--label);
    letter-spacing: 2px;
  }

  .vinyl-progress {
    height: 6px;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(244, 217, 106, 0.25);
    margin: 10px 0 14px;
    overflow: hidden;
  }
  .vinyl-progress .bar {
    height: 100%;
    background: linear-gradient(90deg, var(--pink-hot), var(--label));
    transition: width .3s linear;
  }

  .vinyl-bottom {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: space-between;
    flex-wrap: wrap;
  }
  .vinyl-bottom .vol {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
    color: var(--label);
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
  }
  .vinyl-bottom .vol input[type=range] {
    flex: 1;
    min-width: 60px;
    accent-color: var(--pink-hot);
  }
  .vinyl-stop-btn {
    background: var(--ink);
    color: var(--cream);
    border: 3px solid var(--ink);
    padding: 8px 14px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--maroon);
  }
  .vinyl-stop-btn:hover:not(:disabled) { background: var(--maroon); }
  .vinyl-stop-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Source picker */
  .vinyl-source {
    background: var(--cream);
    border-top: 3px solid var(--ink);
    color: var(--ink);
  }
  .vinyl-tabs {
    display: flex;
    border-bottom: 3px solid var(--ink);
  }
  .vinyl-tabs button {
    flex: 1;
    background: var(--paper);
    border: none;
    border-right: 2px solid var(--ink);
    padding: 12px 8px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    color: var(--ink);
    cursor: pointer;
    text-transform: uppercase;
    transition: background .12s;
  }
  .vinyl-tabs button:last-child { border-right: none; }
  .vinyl-tabs button:hover { background: var(--paper-2); }
  .vinyl-tabs button.active {
    background: var(--maroon);
    color: var(--cream);
  }
  .vinyl-tabpane {
    padding: 18px 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .vinyl-tabpane label {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    color: var(--maroon);
    text-transform: uppercase;
  }
  .vinyl-tabpane input[type=text],
  .vinyl-tabpane input[type=url] {
    width: 100%;
    padding: 10px 12px;
    background: #fff;
    border: 2px solid var(--ink);
    font-family: 'VT323', monospace;
    font-size: 18px;
    color: var(--ink);
    box-shadow: inset 2px 2px 0 rgba(0,0,0,0.08);
  }
  .vinyl-tabpane input[type=text]:focus,
  .vinyl-tabpane input[type=url]:focus {
    outline: none;
    border-color: var(--pink-hot);
  }
  .vinyl-tabpane input[type=file] {
    font-family: 'VT323', monospace;
    font-size: 18px;
    color: var(--ink);
  }
  .vinyl-tabpane .hint {
    font-family: 'VT323', monospace;
    font-size: 16px;
    color: var(--maroon);
    opacity: 0.8;
    line-height: 1.4;
  }
  .vinyl-tabpane .err {
    font-family: 'VT323', monospace;
    font-size: 18px;
    color: var(--pink-hot);
    background: #ffe9ee;
    border-left: 3px solid var(--pink-hot);
    padding: 6px 10px;
  }
  .row-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .row-buttons button,
  .row-buttons a {
    background: var(--ink);
    color: var(--cream);
    border: 3px solid var(--ink);
    padding: 10px 14px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    letter-spacing: 1.2px;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 3px 3px 0 var(--maroon);
    transition: transform .08s, box-shadow .08s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .row-buttons button:hover,
  .row-buttons a:hover { background: var(--maroon); }
  .row-buttons button:active {
    transform: translate(3px, 3px);
    box-shadow: 0 0 0 var(--maroon);
  }
  .big-btn {
    background: var(--pink-hot);
    color: white;
    border: 3px solid var(--ink);
    padding: 16px 18px;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    letter-spacing: 1.5px;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform .08s, box-shadow .08s;
  }
  .big-btn:hover { background: var(--pink); }
  .big-btn.active {
    background: var(--maroon);
    animation: blink 1s steps(2) infinite;
  }

  /* === Pair-code box (setup screen) === */
  .pair-code-box {
    display: flex;
    align-items: stretch;
    gap: 8px;
  }
  .pair-code-text {
    flex: 1;
    padding: 16px 10px;
    background: var(--maroon);
    color: var(--label);
    border: 3px solid var(--ink);
    font-family: 'Press Start 2P', monospace;
    font-size: 20px;
    letter-spacing: 4px;
    text-align: center;
    box-shadow: inset 0 0 0 2px rgba(244, 217, 106, 0.3);
  }
  .pair-code-copy {
    background: var(--ink);
    color: var(--cream);
    border: 3px solid var(--ink);
    padding: 0 14px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    cursor: pointer;
    white-space: nowrap;
  }
  .pair-code-copy:hover { background: var(--maroon); }

  /* === Presence badge in profile bar === */
  .presence-badge {
    margin-left: auto;
    padding: 6px 10px;
    border: 2px solid var(--cream);
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    letter-spacing: 1px;
  }
  .presence-badge.on { background: #2e6b3e; color: #d6f0de; }
  .presence-badge.mid { background: #a07020; color: #fff3d6; animation: blink 1.4s steps(2) infinite; }
  .presence-badge.off { background: #5a2a30; color: #ffcccc; }
  .pair-badge {
    background: var(--ink);
    color: var(--label);
    border: 2px solid var(--label);
    padding: 6px 10px;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    letter-spacing: 2px;
  }
  .profile-bar .profile-logout { margin-left: 0; }

  .composer-presence {
    margin-left: 10px;
    font-family: 'Silkscreen', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
  }
  .composer-presence.on { color: #2e6b3e; }
  .composer-presence.off { color: #a04b30; }

  /* === Toast stack === */
  .toast-stack {
    position: fixed;
    top: 14px;
    right: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 4000;
    max-width: min(360px, calc(100vw - 28px));
    pointer-events: none;
  }
  .toast {
    pointer-events: auto;
    background: var(--cream);
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 var(--maroon);
    padding: 10px 36px 10px 14px;
    font-family: 'VT323', monospace;
    font-size: 18px;
    color: var(--ink);
    line-height: 1.35;
    position: relative;
    animation: toastIn 0.25s ease;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .toast-letter { background: #ffe9ee; }
  .toast-alarm  { background: #fff3d6; }
  .toast-track  { background: #d8ebeb; }
  .toast-counter{ background: #e7e0c8; }
  .toast-presence { background: #d6f0de; }
  .toast-queued { background: #f3e3c4; }
  .toast-close {
    position: absolute;
    top: 4px; right: 6px;
    width: 22px; height: 22px;
    border: 2px solid var(--ink);
    background: var(--cream);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 0;
  }

  /* Vinyl saved-library list */
  .vinyl-library {
    list-style: none;
    margin: 0; padding: 0;
    display: flex; flex-direction: column;
    gap: 8px;
    max-height: 320px;
    overflow-y: auto;
  }
  .lib-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: #fff;
    border: 2px solid var(--ink);
    box-shadow: 2px 2px 0 var(--maroon);
  }
  .lib-item.playing {
    background: #ffe9ee;
    border-color: var(--pink-hot);
    box-shadow: 2px 2px 0 var(--pink-hot);
  }
  .lib-info { flex: 1; min-width: 0; }
  .lib-title {
    font-family: 'VT323', monospace;
    font-size: 20px;
    color: var(--ink);
    line-height: 1.2;
    word-break: break-word;
  }
  .lib-meta {
    font-family: 'Silkscreen', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    opacity: 0.7;
    margin-top: 2px;
  }
  .lib-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .lib-btn {
    background: var(--ink);
    color: var(--cream);
    border: 2px solid var(--ink);
    padding: 6px 10px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    cursor: pointer;
  }
  .lib-btn:hover { background: var(--maroon); }
  .lib-btn.send { background: var(--teal); }
  .lib-btn.send:hover { background: var(--teal-deep); }
  .lib-btn.del { background: var(--pink-hot); padding: 6px 9px; font-size: 11px; }
  .lib-btn.del:hover { background: var(--maroon-deep); }

  @media (max-width: 560px) {
    .vinyl-deck { padding: 22px 14px 18px; }
    .vinyl-tabs button { font-size: 8px; padding: 10px 4px; }
    .vinyl-tabpane { padding: 14px 14px 16px; }
  }

  /* ============== COUPLE: SETUP / PROFILE / LETTERS ============== */
  .couple-setup-overlay {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255, 92, 138, 0.18) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 80%, rgba(244, 217, 106, 0.18) 0%, transparent 60%),
      linear-gradient(160deg, #3a0f1c 0%, #1a0a12 100%);
    z-index: 1000;
    display: grid;
    place-items: center;
    padding: 20px;
    overflow: auto;
  }
  .couple-setup-overlay::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px);
    pointer-events: none;
  }
  .couple-setup-card {
    background: var(--cream);
    border: 3px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink), 6px 6px 0 3px var(--maroon);
    padding: 32px 28px 26px;
    max-width: 440px;
    width: 100%;
    position: relative;
    z-index: 1;
  }
  .setup-stars {
    position: absolute; inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .setup-header {
    text-align: center;
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 3px dashed var(--ink);
  }
  .setup-icon {
    margin-bottom: 12px;
  }
  .setup-header h2 {
    margin: 0 0 10px;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--maroon);
  }
  .setup-header p {
    margin: 0;
    font-family: 'VT323', monospace;
    font-size: 19px;
    color: var(--ink-soft);
    line-height: 1.4;
  }
  .setup-field {
    margin-bottom: 16px;
  }
  .setup-field label {
    display: block;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    letter-spacing: 1.2px;
    color: var(--maroon);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .setup-field input[type=text] {
    width: 100%;
    padding: 10px 12px;
    background: #fff;
    border: 2px solid var(--ink);
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: var(--ink);
    box-shadow: inset 2px 2px 0 rgba(0,0,0,0.06);
  }
  .setup-field input[type=text]:focus {
    outline: none;
    border-color: var(--pink-hot);
  }
  .setup-radios {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .setup-radio {
    background: #fff;
    border: 2px solid var(--ink);
    padding: 12px 14px;
    cursor: pointer;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background .12s, color .12s;
    text-align: left;
  }
  .setup-radio .dot {
    width: 12px; height: 12px;
    background: var(--label);
    border: 2px solid var(--ink);
    flex-shrink: 0;
  }
  .setup-radio .dot.pink { background: var(--pink); }
  .setup-radio:hover { background: var(--paper); }
  .setup-radio.active {
    background: var(--maroon);
    color: var(--cream);
    box-shadow: 3px 3px 0 var(--ink);
  }
  .setup-start {
    width: 100%;
    margin-top: 8px;
    padding: 14px;
    background: var(--pink-hot);
    color: white;
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: transform .08s, box-shadow .08s, background .15s;
  }
  .setup-start:hover { background: var(--pink); }
  .setup-start:active {
    transform: translate(4px, 4px);
    box-shadow: 0 0 0 var(--ink);
  }
  .setup-hint {
    margin-top: 12px;
    font-family: 'VT323', monospace;
    font-size: 16px;
    color: var(--ink-soft);
    text-align: center;
    opacity: 0.7;
  }

  /* PROFILE BAR */
  .profile-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;

  .letters-notice {

    color: var(--ink);

  .letter.mine { justify-content: flex-end; }
  .letter.theirs { justify-content: flex-start; }

    max-width: 78%;

    border: 2px solid var(--ink);

    box-shadow: 3px 3px 0 var(--ink);

  .letter.mine .letter-bubble {
    background: #ffe9ee;
    border-color: var(--maroon);
    box-shadow: 3px 3px 0 var(--maroon);
  }
  .letter.theirs .letter-bubble {
    background: #f4ebd8;
    border-color: var(--ink);
  }
  .letter-head {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px dashed rgba(0,0,0,0.2);

  .letter-from {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    letter-spacing: 1px;
    color: var(--maroon);
  }
  .letter.theirs .letter-from { color: var(--teal-deep); }
  .letter-ts {
    font-family: 'Silkscreen', monospace;
    font-size: 11px;
    color: var(--ink-soft);

    font-family: 'VT323', monospace;
    font-size: 22px;

  .letter-del {
    position: absolute;
    top: -8px; right: -8px;
    width: 22px; height: 22px;
    border: 2px solid var(--ink);
    background: var(--ink);
    color: var(--cream);

    font-size: 14px;
    line-height: 1;

    font-family: 'Press Start 2P', monospace;
    font-size: 10px;

  .share-modal {

  .share-hint {
    font-family: 'VT323', monospace;

    padding: 8px 12px;
  }
  .share-close {
    position: absolute;
    top: 8px; right: 10px;
    width: 28px; height: 28px;
    border: 2px solid var(--ink);
    background: var(--cream);
    color: var(--ink);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 0;

  @media (max-width: 560px) {
    .couple-setup-card { padding: 22px 18px 20px; }

  /* ============== STEPS / LOGIN / CUSTOM SECTIONS ============== */
  .setup-steps {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .setup-step {
    width: 28px; height: 28px;
    border: 2px solid var(--ink);
    background: var(--cream);
    color: var(--ink);

    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    border-radius: 50%;

  .setup-step.active {
    background: var(--pink-hot);

    box-shadow: 2px 2px 0 var(--ink);

  .setup-step.done {
    background: var(--maroon);

    height: 3px;

  .setup-err {
    background: #ffe9ee;

    margin-bottom: 10px;
    font-family: 'VT323', monospace;
    font-size: 18px;

  .setup-reset-link {
    background: none;
    border: none;
    color: var(--maroon);

    cursor: pointer;
    font-family: 'VT323', monospace;
    font-size: 16px;
    padding: 0;
  }
  .setup-reset-link:hover { color: var(--pink-hot); }

  .profile-logout {
    margin-left: auto;
    background: var(--ink);
    color: var(--cream);
    border: 2px solid var(--cream);
    padding: 7px 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background .12s;
  }
  .profile-logout:hover { background: var(--pink-hot); }

  .section-desc {
    font-family: 'VT323', monospace;
    font-size: 18px;
    color: var(--ink-soft);
    line-height: 1.5;
    padding: 0 4px;
    margin: 0 0 16px;
    opacity: 0.85;
  }

  /* CUSTOM SECTION (counters + alarms) */
  .custom-section {
    margin-bottom: 24px;
  }
  .custom-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 10px;
  }
  .custom-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--maroon);
  }
  .custom-add {
    background: var(--pink-hot);
    color: white;
    border: 3px solid var(--ink);
    padding: 8px 14px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    letter-spacing: 1.2px;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .08s, background .15s;
  }
  .custom-add:hover { background: var(--pink); }
  .custom-add:active {
    transform: translate(3px, 3px);
    box-shadow: 0 0 0 var(--ink);
  }
  .custom-desc {
    font-family: 'VT323', monospace;
    font-size: 17px;
    color: var(--ink-soft);
    line-height: 1.4;
    margin-bottom: 14px;
    opacity: 0.75;
  }
  .custom-empty {
    background: var(--paper);
    border: 2px dashed var(--maroon);
    padding: 20px;
    text-align: center;
    font-family: 'VT323', monospace;
    font-size: 18px;
    color: var(--ink-soft);
  }

  .counter .ctr-desc {
    font-family: 'VT323', monospace;
    font-size: 15px;
    color: rgba(244, 217, 106, 0.55);
    margin-top: 8px;
    line-height: 1.3;
    position: relative; z-index: 1;
    font-style: italic;
  }
  .ctr-del {
    position: absolute;
    top: 8px; left: 10px;
    width: 20px; height: 20px;
    background: rgba(255, 92, 138, 0.2);
    color: var(--pink-hot);
    border: 1px solid var(--pink-hot);
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
    padding: 0;
    border-radius: 3px;
    z-index: 2;
    transition: background .12s;
  }
  .ctr-del:hover { background: var(--pink-hot); color: white; }

  /* ALARMS */
  .alarms {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }
  @media (min-width: 720px) {
    .alarms { grid-template-columns: 1fr 1fr; }
  }
  .alarm {
    background: var(--crt);
    border: 3px solid var(--ink);
    box-shadow: 5px 5px 0 var(--ink);
    padding: 16px 18px 16px;
    color: var(--crt-glow);
    position: relative;
    overflow: hidden;
  }
  .alarm::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 3px);
    pointer-events: none;
  }
  .alarm.fired {
    background: var(--maroon);
    border-color: var(--pink-hot);
    animation: alarmPulse 1s ease-in-out infinite;
  }
  @keyframes alarmPulse {
    0%, 100% { box-shadow: 5px 5px 0 var(--ink); }
    50% { box-shadow: 5px 5px 0 var(--ink), 0 0 16px var(--pink-hot); }
  }
  .alarm-led {
    position: absolute;
    top: 12px; right: 14px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--pink-hot);
    box-shadow: 0 0 8px var(--pink-hot);
    animation: blink 1.4s steps(2) infinite;
  }
  .alarm-head {
    margin-bottom: 14px;
    position: relative; z-index: 1;
    padding-right: 24px;
  }
  .alarm-title {
    display: block;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--label);
    margin-bottom: 6px;
  }
  .alarm.fired .alarm-title { color: var(--cream); }
  .alarm-target {
    display: block;
    font-family: 'Silkscreen', monospace;
    font-size: 13px;
    color: rgba(142, 255, 193, 0.7);
    letter-spacing: 0.5px;
  }
  .alarm.fired .alarm-target { color: rgba(255, 255, 255, 0.85); }
  .alarm-big {
    display: flex;
    flex-wrap: wrap;

    margin-bottom: 6px;
    line-height: 1;
  }
  .alarm-num {
    font-family: 'Press Start 2P', monospace;
    font-size: 18px;
    color: var(--crt-glow);
    text-shadow: 0 0 8px rgba(142, 255, 193, 0.45);
    letter-spacing: 1px;
  }
  .alarm-unit {
    font-family: 'Silkscreen', monospace;
    font-size: 11px;
    color: rgba(244, 217, 106, 0.65);
    margin-right: 6px;
  }
  .alarm-big.fired-msg {
    display: block;
    font-family: 'Press Start 2P', monospace;
    font-size: 18px;
    color: var(--label);
    text-shadow: 0 0 8px var(--label);
    letter-spacing: 2px;
    text-align: center;
    margin: 8px 0;
  }
  .alarm-desc {
    font-family: 'VT323', monospace;
    font-size: 17px;
    color: rgba(255, 255, 255, 0.75);
    line-height: 1.3;
    margin-top: 8px;
    position: relative; z-index: 1;
    font-style: italic;
  }
  .alarm-del {
    position: absolute;
    bottom: 10px; right: 12px;
    width: 22px; height: 22px;
    background: rgba(255, 92, 138, 0.2);
    color: var(--pink-hot);
    border: 1px solid var(--pink-hot);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 0;
    border-radius: 3px;
    z-index: 2;
  }
  .alarm-del:hover { background: var(--pink-hot); color: white; }

  /* FORM MODALS */
  .form-card form {
    text-align: left;
  }
  .form-card h3 { text-align: center; }
  .form-field {
    margin-bottom: 14px;
  }
  .form-field label {
    display: block;
    font-family: 'Press Start 2P', monospace;

  .form-field input[type=text],
  .form-field input[type=date],
  .form-field input[type=datetime-local],
  .form-field textarea {
    width: 100%;
    padding: 10px 12px;
    background: #fff;
    border: 2px solid var(--ink);
    font-family: 'VT323', monospace;
    font-size: 20px;
    color: var(--ink);
    box-shadow: inset 2px 2px 0 rgba(0,0,0,0.06);
  }
  .form-field textarea {
    resize: vertical;
    line-height: 1.4;
  }
  .form-field input:focus,
  .form-field textarea:focus {
    outline: none;
    border-color: var(--pink-hot);
  }
  .form-hint {
    font-family: 'VT323', monospace;
    font-size: 15px;
    color: var(--ink-soft);
    opacity: 0.8;
    margin-top: 6px;
    line-height: 1.3;
  }
  .form-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 16px;
  }
  .btn-primary {
    background: var(--pink-hot);
    color: white;
    border: 3px solid var(--ink);
    padding: 10px 18px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .btn-primary:hover { background: var(--pink); }
  .btn-secondary {
    background: var(--cream);
    color: var(--ink);
    border: 3px solid var(--ink);
    padding: 10px 14px;
    font-family: 'Press Start 2P', monospace;

  /* Helper text */

    .map-foot { grid-template-columns: 1fr; gap: 6px; }
    .section-head .title { font-size: 9px; }
  }
</style>

/* === couple.jsx === */
// ============ TWO-PERSON MODE — P2P (PeerJS) ============
// Pair code based real-time messenger. No URL hash. Each device has a stable
// PeerJS ID derived from {pairCode, slot}; both peers attempt to connect to
// each other every time the app loads. Letters, counter changes, alarm
// changes, and shared vinyl tracks flow over a WebRTC data channel.
// Messages sent while the partner is offline are queued in a local outbox
// and flushed when the partner comes online.

const { useState: cpUseState, useEffect: cpUseEffect, useRef: cpUseRef, useCallback: cpUseCallback } = React;

const COUPLE_KEY = 'twosite.state.v3';
const OUTBOX_KEY_PREFIX = 'twosite.outbox.v1.';
const PEER_ID_PREFIX = 'mixtape-twosite-v1-';

function cpLoad() {
  try {
    const raw = localStorage.getItem(COUPLE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || typeof s !== 'object') return null;
    return s;
  } catch (e) { return null; }
}
function cpSave(state) {
  try { localStorage.setItem(COUPLE_KEY, JSON.stringify(state)); } catch (e) {}
}
function cpDefault() {
  return {
    pairCode: null,
    myUserId: null,        // 'a' (creator) | 'b' (joiner)
    myPin: null,           // local-only
    isLoggedIn: false,
    users: { a: { name: '' }, b: { name: '' } },
    letters: [],
    counters: [],
    alarms: [],
    setupAt: null,
  };
}
function cpUid() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}
function cpFmt(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function cpRandomPairCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

// ============ NETWORK LAYER (PeerJS) ============
const CoupleNet = {
  peer: null,
  conn: null,
  state: 'off',          // 'off' | 'starting' | 'waiting' | 'online'
  pairCode: null,
  mySlot: null,
  partnerSlot: null,
  outboxKey: null,
  handlers: {},
  retryTimer: null,
  reconnectTimer: null,
  stopped: true,

  start(pairCode, mySlot) {
    if (this.pairCode === pairCode && this.mySlot === mySlot && this.peer && !this.peer.destroyed) {
      // already running with same params
      return;
    }
    this.stop();
    this.stopped = false;
    this.pairCode = pairCode;
    this.mySlot = mySlot;
    this.partnerSlot = mySlot === 'a' ? 'b' : 'a';
    this.outboxKey = OUTBOX_KEY_PREFIX + pairCode + '.' + mySlot;
    this._init();
  },

  stop() {
    this.stopped = true;
    if (this.retryTimer) { clearTimeout(this.retryTimer); this.retryTimer = null; }
    if (this.reconnectTimer) { clearTimeout(this.reconnectTimer); this.reconnectTimer = null; }
    if (this.conn) { try { this.conn.close(); } catch (e) {} this.conn = null; }
    if (this.peer) { try { this.peer.destroy(); } catch (e) {} this.peer = null; }
    this._setState('off');
  },

  _peerIdFor(slot) {
    return PEER_ID_PREFIX + this.pairCode + '-' + slot;
  },

  _init() {
    if (typeof Peer === 'undefined') {
      console.error('[CoupleNet] PeerJS library not loaded');
      this._setState('off');
      return;
    }
    this._setState('starting');
    const myId = this._peerIdFor(this.mySlot);
    try {
      this.peer = new Peer(myId, { debug: 0 });
    } catch (e) {
      console.error('[CoupleNet] Peer ctor failed', e);
      this._scheduleReinit();
      return;
    }
    this.peer.on('open', () => {
      this._setState('waiting');
      this._tryConnect();
    });
    this.peer.on('connection', (c) => { this._attach(c); });

      const t = err && err.type;
      if (t === 'unavailable-id') {

  _scheduleReinit(delay) {

    if (this.reconnectTimer) clearTimeout(this.reconnectTimer);

  _tryConnect() {
