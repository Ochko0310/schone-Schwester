    if (this.conn && this.conn.open) return;
    if (!this.peer || !this.peer.id) return;
    try {
      const c = this.peer.connect(this._peerIdFor(this.partnerSlot), { reliable: true, serialization: 'binary' });
      let opened = false;
      c.on('open', () => { opened = true; this._attach(c); });
      c.on('error', () => { if (!opened) this._scheduleConnectRetry(); });
      // If never opens, schedule retry
      setTimeout(() => { if (!opened && this.state !== 'online') this._scheduleConnectRetry(); }, 7000);
    } catch (e) {
      this._scheduleConnectRetry();
    }
  },

  _attach(conn) {
    if (this.conn && this.conn !== conn && this.conn.open) {
      // Already have one — keep existing, drop new
      try { conn.close(); } catch (_) {}
      return;
    }
    this.conn = conn;

    // Wire data/close/error handlers immediately. State and outbox flush
    // wait until the data channel is actually OPEN — otherwise sends are
    // silently dropped by PeerJS.
    conn.on('data', (d) => this._emit('message', d));
    conn.on('close', () => {
      if (this.conn === conn) this.conn = null;
      if (!this.stopped) {
        this._setState('waiting');
        this._scheduleConnectRetry(2000);
      }
    });
    conn.on('error', (e) => { console.warn('[CoupleNet] conn error', e); });

    const onReady = () => {
      if (this.conn !== conn) return; // we got replaced
      this._setState('online');
      this._emit('connected');
      // Flush any messages queued while offline. Slight delay lets the
      // 'connected' handler (in the React hook) emit hello+sync-bulk first.
      setTimeout(() => this._flushOutbox(), 60);
    };
    if (conn.open) onReady();
    else conn.on('open', onReady);
  },

  send(msg) {
    if (this.conn && this.conn.open) {
      try { this.conn.send(msg); return true; }
      catch (e) { console.warn('[CoupleNet] send failed', e); this._queue(msg); return false; }
    }
    this._queue(msg);
    return false;
  },

  _queue(msg) {
    if (!this.outboxKey) return;
    if (msg && msg.skipQueue) return;
    try {
      const raw = localStorage.getItem(this.outboxKey);
      const list = raw ? JSON.parse(raw) : [];
      // Replace blob-y msgs with metadata since localStorage can't hold large Blobs
      const safe = this._stripForQueue(msg);
      if (safe) {
        list.push(safe);
        // Cap outbox to last 50 items to avoid runaway growth
        const trimmed = list.length > 50 ? list.slice(-50) : list;
        localStorage.setItem(this.outboxKey, JSON.stringify(trimmed));
      }
    } catch (e) { /* localStorage full or other; ignore */ }
  },

  _stripForQueue(msg) {
    if (!msg || typeof msg !== 'object') return msg;
    // Track messages contain large Blobs — don't queue those (partner can re-send later)
    if (msg.type === 'track') return null;
    return msg;
  },

  _flushOutbox() {
    if (!this.outboxKey) return;
    try {
      const raw = localStorage.getItem(this.outboxKey);
      if (!raw) return;
      const list = JSON.parse(raw) || [];
      localStorage.removeItem(this.outboxKey);
      for (const m of list) {
        if (this.conn && this.conn.open) {
          try { this.conn.send(m); } catch (e) { console.warn(e); }
        }
      }
    } catch (e) {}
  },

  _setState(s) {
    if (this.state === s) return;
    this.state = s;
    this._emit('state', s);
  },

  on(event, fn) {
    if (!this.handlers[event]) this.handlers[event] = [];
    this.handlers[event].push(fn);
    return () => this.off(event, fn);
  },
  off(event, fn) {
    if (!this.handlers[event]) return;
    this.handlers[event] = this.handlers[event].filter(f => f !== fn);
  },
  _emit(event, data) {
    (this.handlers[event] || []).forEach(fn => {
      try { fn(data); } catch (e) { console.error(e); }
    });
  },
};

// Expose to window so other modules / debugging can reach it
if (typeof window !== 'undefined') window.CoupleNet = CoupleNet;

// ============ Notifications ============
function cpRequestNotificationPermission() {
  if (!('Notification' in window)) return Promise.resolve('denied');
  if (Notification.permission === 'granted' || Notification.permission === 'denied') {
    return Promise.resolve(Notification.permission);
  }
  return Notification.requestPermission();
}
function cpSystemNotify(title, body) {
  if (!('Notification' in window)) return;
  if (Notification.permission !== 'granted') return;
  try { new Notification(title, { body }); } catch (e) {}
}
function cpToast(detail) {
  try { window.dispatchEvent(new CustomEvent('couple:toast', { detail })); } catch (e) {}
}

// ============ HOOK ============
function useCouple() {
  const [state, setState] = cpUseState(() => cpLoad() || cpDefault());
  const [netState, setNetState] = cpUseState(() => CoupleNet.state);

  const stateRef = cpUseRef(state);
  cpUseEffect(() => { stateRef.current = state; cpSave(state); }, [state]);

  // Wire CoupleNet to React state when logged in
  cpUseEffect(() => {
    if (!state.setupAt || !state.pairCode || !state.myUserId) {
      CoupleNet.stop();
      setNetState('off');
      return;
    }
    CoupleNet.start(state.pairCode, state.myUserId);
    const offState = CoupleNet.on('state', s => setNetState(s));
    const offConnected = CoupleNet.on('connected', () => {
      // Send hello + sync-bulk on connect
      CoupleNet.send({
        type: 'hello',
        name: stateRef.current.users[stateRef.current.myUserId]?.name || '',
        slot: stateRef.current.myUserId,
      });
      CoupleNet.send({
        type: 'sync-bulk',
        users: stateRef.current.users,
        letters: stateRef.current.letters,
        counters: stateRef.current.counters,
        alarms: stateRef.current.alarms,
      });
    });
    const offMsg = CoupleNet.on('message', (m) => handleIncoming(m));
    return () => { offState(); offConnected(); offMsg(); };
    // Only re-start when pairCode or slot actually changes
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [state.pairCode, state.myUserId, state.setupAt]);

  // ----- Incoming message handler -----
  function handleIncoming(m) {
    if (!m || typeof m !== 'object') return;
    const t = m.type;
    if (t === 'hello') {
      // Partner came online: store their name + toast
      setState(s => {
        const slot = m.slot || (s.myUserId === 'a' ? 'b' : 'a');
        const newUsers = { ...s.users, [slot]: { name: m.name || s.users[slot]?.name || '' } };
        return { ...s, users: newUsers };
      });
      const name = m.name || 'Хамтрагч';
      cpToast({ kind: 'presence', text: name + ' холбогдлоо' });
    }
    else if (t === 'sync-bulk') {
      setState(s => mergeIncoming(s, m));
    }
    else if (t === 'letter') {
      setState(s => {
        if (s.letters.some(l => l.id === m.letter.id)) return s;
        const next = { ...s, letters: [...s.letters, m.letter].sort((a, b) => a.ts - b.ts) };
        return next;
      });
      const fromName = stateRef.current.users[m.letter?.from]?.name || 'Хамтрагч';
      cpToast({ kind: 'letter', text: '✉ ' + fromName + ': ' + (m.letter.text || '').slice(0, 60) });
      cpSystemNotify('✉ Шинэ захидал', fromName + ': ' + (m.letter.text || '').slice(0, 80));
    }
    else if (t === 'letter-del') {
      setState(s => ({ ...s, letters: s.letters.filter(l => l.id !== m.id) }));
    }
    else if (t === 'counter-add') {
      setState(s => {
        const cs = s.counters || [];
        if (cs.some(c => c.id === m.counter.id)) return s;
        return { ...s, counters: [...cs, m.counter] };
      });
      cpToast({ kind: 'counter', text: '⏱ Шинэ тоолуур: ' + (m.counter?.title || '') });
    }
    else if (t === 'counter-del') {
      setState(s => ({ ...s, counters: (s.counters || []).filter(c => c.id !== m.id) }));
    }
    else if (t === 'alarm-add') {
      setState(s => {
        const as = s.alarms || [];
        if (as.some(a => a.id === m.alarm.id)) return s;
        return { ...s, alarms: [...as, m.alarm] };
      });
      cpToast({ kind: 'alarm', text: '🔔 Шинэ дохиолол: ' + (m.alarm?.title || '') });
      cpSystemNotify('🔔 Шинэ дохиолол', m.alarm?.title || '');
    }
    else if (t === 'alarm-del') {
      setState(s => ({ ...s, alarms: (s.alarms || []).filter(a => a.id !== m.id) }));
    }
    else if (t === 'track') {
      // Audio track sharing — handed off to vinyl-player listener via window event
      try {
        window.dispatchEvent(new CustomEvent('couple:track', { detail: m }));
      } catch (e) {}
      const title = m.track?.title || 'Дуу';
      cpToast({ kind: 'track', text: '♪ ' + title + ' — санд хадгалагдлаа' });
      cpSystemNotify('♪ Шинэ дуу', title);
    }
    else if (t === 'vinyl-source' || t === 'vinyl-play' || t === 'vinyl-pause' || t === 'vinyl-seek' || t === 'vinyl-stop' || t === 'vinyl-pos') {
      // Real-time vinyl playback sync
      try { window.dispatchEvent(new CustomEvent('couple:vinyl', { detail: m })); } catch (e) {}
    }
  }

  function mergeIncoming(s, m) {
    const next = { ...s };
    // Users: preserve our own name, accept partner's
    if (m.users) {
      next.users = {
        a: { name: (s.myUserId === 'a' ? s.users.a?.name : (s.users.a?.name || m.users.a?.name)) || '' },
        b: { name: (s.myUserId === 'b' ? s.users.b?.name : (s.users.b?.name || m.users.b?.name)) || '' },
      };
    }
    // Letters
    if (Array.isArray(m.letters)) {
      const have = new Set(s.letters.map(l => l.id));
      const incoming = m.letters.filter(l => l && l.id && !have.has(l.id));
      next.letters = [...s.letters, ...incoming].sort((a, b) => a.ts - b.ts);
    }
    // Counters
    if (Array.isArray(m.counters)) {
      const have = new Set((s.counters || []).map(c => c.id));
      next.counters = [...(s.counters || []), ...m.counters.filter(c => c && c.id && !have.has(c.id))];
    }
    // Alarms
    if (Array.isArray(m.alarms)) {
      const have = new Set((s.alarms || []).map(a => a.id));
      next.alarms = [...(s.alarms || []), ...m.alarms.filter(a => a && a.id && !have.has(a.id))];
    }
    return next;
  }

  // ----- Setup completion -----
  const completeSetup = ({ myUserId, myName, pairCode, myPin }) => {
    setState(s => {
      const users = {
        a: { name: myUserId === 'a' ? myName : (s.users.a?.name || '') },
        b: { name: myUserId === 'b' ? myName : (s.users.b?.name || '') },
      };
      return {
        ...s,
        pairCode,
        myUserId,
        myPin,
        isLoggedIn: true,
        users,
        setupAt: Date.now(),
      };
    });
    cpRequestNotificationPermission();
  };

  const login = (pin) => {
    if (pin === state.myPin) {
      setState(s => ({ ...s, isLoggedIn: true }));
      return true;
    }
    return false;
  };
  const logout = () => setState(s => ({ ...s, isLoggedIn: false }));
  const resetAll = () => {
    if (CoupleNet) CoupleNet.stop();
    localStorage.removeItem(COUPLE_KEY);
    // Clear all outboxes for this user
    try {
      const keys = Object.keys(localStorage).filter(k => k.startsWith(OUTBOX_KEY_PREFIX));
      keys.forEach(k => localStorage.removeItem(k));
    } catch (e) {}
    setState(cpDefault());
  };

  // ----- Actions (local update + network broadcast) -----
  const sendLetter = (text) => {
    const t = (text || '').trim();
    if (!t || !state.myUserId) return null;
    const from = state.myUserId;
    const to = from === 'a' ? 'b' : 'a';
    const letter = { id: cpUid(), from, to, text: t, ts: Date.now() };
    setState(s => ({ ...s, letters: [...s.letters, letter] }));
    CoupleNet.send({ type: 'letter', letter });
    return letter;
  };
  const deleteLetter = (id) => {
    setState(s => ({ ...s, letters: s.letters.filter(l => l.id !== id) }));
    CoupleNet.send({ type: 'letter-del', id });
  };
  const addCounter = (counter) => {
    const c = { ...counter, id: cpUid(), createdAt: Date.now() };
    setState(s => ({ ...s, counters: [...(s.counters || []), c] }));
    CoupleNet.send({ type: 'counter-add', counter: c });
    return c;
  };
  const deleteCounter = (id) => {
    setState(s => ({ ...s, counters: (s.counters || []).filter(c => c.id !== id) }));
    CoupleNet.send({ type: 'counter-del', id });
  };
  const addAlarm = (alarm) => {
    const a = { ...alarm, id: cpUid(), createdAt: Date.now() };
    setState(s => ({ ...s, alarms: [...(s.alarms || []), a] }));
    CoupleNet.send({ type: 'alarm-add', alarm: a });
    return a;
  };
  const deleteAlarm = (id) => {
    setState(s => ({ ...s, alarms: (s.alarms || []).filter(a => a.id !== id) }));
    CoupleNet.send({ type: 'alarm-del', id });
  };

  return {
    state, netState,
    completeSetup, login, logout, resetAll,
    sendLetter, deleteLetter,
    addCounter, deleteCounter,
    addAlarm, deleteAlarm,
  };
}

// ============ SETUP UI ============
function CoupleSetup({ state, onComplete }) {
  // step: 'choose' | 'created' | 'enter-code' | 'name' | 'pin'
  const [step, setStep] = cpUseState('choose');
  const [pairCode, setPairCode] = cpUseState('');
  const [myUserId, setMyUserId] = cpUseState(null);
  const [myName, setMyName] = cpUseState('');
  const [myPin, setMyPin] = cpUseState('');
  const [confirmPin, setConfirmPin] = cpUseState('');
  const [err, setErr] = cpUseState('');

  const handleCreate = () => {
    const code = cpRandomPairCode();
    setPairCode(code);
    setMyUserId('a');
    setStep('created');
  };

  const handleEnter = () => {
    setMyUserId('b');
    setStep('enter-code');
  };

  const submitCode = (e) => {
    e.preventDefault();
    const code = pairCode.trim().toUpperCase();
    if (!/^[A-Z0-9]{4,8}$/.test(code)) { setErr('Кодыг 4-8 оронтой үсэг/тоогоор оруулна уу'); return; }
    setErr('');
    setPairCode(code);
    setStep('name');
  };

  const submitName = (e) => {
    e.preventDefault();
    if (!myName.trim()) { setErr('Өөрийн нэрээ оруулна уу'); return; }
    setErr('');
    setStep('pin');
  };

  const submitPin = (e) => {
    e.preventDefault();
    if (!/^\d{4,6}$/.test(myPin)) { setErr('PIN-ийг 4-6 оронтой тоогоор оруулна уу'); return; }
    if (myPin !== confirmPin) { setErr('PIN таарахгүй байна'); return; }
    setErr('');
    onComplete({ myUserId, myName: myName.trim(), pairCode, myPin });
  };

  const copyCode = async () => {
    try { await navigator.clipboard.writeText(pairCode); } catch (e) {}
  };

  return (
    <div className="couple-setup-overlay">
      <div className="couple-setup-card">
        <div className="setup-header">
          <h2>★ ХУВИЙН ОРОН ЗАЙ ★</h2>
          <p>P2P холболттой — захидал, тоолуур, дохиолол real-time-аар нөгөө хүндээ очно.</p>
        </div>

        {step === 'choose' && (
          <div>
            <div className="setup-field">
              <label>Хэрхэн эхлэх вэ?</label>
              <div className="setup-radios" style={{ gridTemplateColumns: '1fr' }}>
                <button type="button" className="setup-radio" onClick={handleCreate}>
                  <span className="dot"></span>
                  <span>★ Шинэ хос үүсгэх (код үүсгэх)</span>
                </button>
                <button type="button" className="setup-radio" onClick={handleEnter}>
                  <span className="dot pink"></span>
                  <span>↪ Хамтрагчаас ирсэн код оруулах</span>
                </button>
              </div>
            </div>
            <div className="setup-hint">
              Шинээр эхлэхээр код үүснэ. Үүнийг нөгөө хүндээ messenger/SMS-ээр явуулна. Тэр код оруулсны дараа хоёулаа real-time холбогдох болно.
            </div>
          </div>
        )}

        {step === 'created' && (
          <div>
            <div className="setup-field">
              <label>Таны хосын код</label>
              <div className="pair-code-box">
                <span className="pair-code-text">{pairCode}</span>
                <button type="button" className="pair-code-copy" onClick={copyCode}>📋 Хуулах</button>
              </div>
            </div>
            <div className="setup-hint" style={{ textAlign: 'left' }}>
              Энэ кодыг хамтрагчдаа явуулна уу (messenger, SMS, и.и.). Тэр энэ кодыг өөрийн төхөөрөмж дээр оруулсны дараа л хоёр тал холбогдоно.
            </div>
            <button type="button" className="setup-start" onClick={() => setStep('name')}>Үргэлжлүүлэх →</button>
          </div>
        )}

        {step === 'enter-code' && (
          <form onSubmit={submitCode}>
            <div className="setup-field">
              <label>Хамтрагчаас ирсэн код</label>
              <input
                type="text"
                value={pairCode}
                onChange={e => setPairCode(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8))}
                placeholder="Жнь: 7X4PQR"
                maxLength={8}
                autoFocus
                style={{ textTransform: 'uppercase', letterSpacing: 4, textAlign: 'center', fontSize: 22 }}
              />
            </div>
            {err && <div className="setup-err">{err}</div>}
            <button type="submit" className="setup-start">Үргэлжлүүлэх →</button>
            <div className="setup-hint">Код хамтрагчийнхтай яг адил байх ёстой.</div>
          </form>
        )}

        {step === 'name' && (
          <form onSubmit={submitName}>
            <div className="setup-field">
              <label>Өөрийн нэр</label>
              <input
                type="text"
                value={myName}
                onChange={e => setMyName(e.target.value)}
                placeholder="Жнь: Очбадрах"
                maxLength={24}
                autoFocus
              />
            </div>
            {err && <div className="setup-err">{err}</div>}
            <button type="submit" className="setup-start">Үргэлжлүүлэх →</button>
            <div className="setup-hint">
              Хосын код: <b>{pairCode}</b>
            </div>
          </form>
        )}

        {step === 'pin' && (
          <form onSubmit={submitPin}>
            <div className="setup-field">
              <label>PIN код (4-6 оронтой тоо)</label>
              <input
                type="password"
                value={myPin}
                onChange={e => setMyPin(e.target.value.replace(/\D/g, '').slice(0, 6))}
                placeholder="Жнь: 1234"
                inputMode="numeric"
                maxLength={6}
                autoFocus
              />
            </div>
            <div className="setup-field">
              <label>PIN-ээ давтаж бичнэ үү</label>
              <input
                type="password"
                value={confirmPin}
                onChange={e => setConfirmPin(e.target.value.replace(/\D/g, '').slice(0, 6))}
                placeholder="давтах"
                inputMode="numeric"
                maxLength={6}
              />
            </div>
            {err && <div className="setup-err">{err}</div>}
            <button type="submit" className="setup-start">► ОРОХ</button>
            <div className="setup-hint">PIN зөвхөн энэ төхөөрөмж дотор хадгалагдана.</div>
          </form>
        )}
      </div>
    </div>
  );
}

// ============ LOGIN ============
function CoupleLogin({ state, onLogin, onReset }) {
  const [pin, setPin] = cpUseState('');
  const [err, setErr] = cpUseState('');
  const myName = state.users[state.myUserId]?.name || 'Хэрэглэгч';

  const submit = (e) => {
    e.preventDefault();
    if (!pin) return;
    if (onLogin(pin)) { setErr(''); }
    else { setErr('PIN буруу байна'); setPin(''); }
  };
  const handleReset = () => {
    if (window.confirm('Бүгдийг сэргээх үү? Хадгалсан өгөгдөл (захидал, тоолуур, дохиолол) устана.')) {
      onReset();
    }
  };

  return (
    <div className="couple-setup-overlay">
      <div className="couple-setup-card">
        <div className="setup-header">
          <h2>САЙН УУ, {myName.toUpperCase()}</h2>
          <p>PIN кодоо оруулна уу.</p>
        </div>
        <form onSubmit={submit}>
          <div className="setup-field">
            <label>PIN код</label>
            <input
              type="password"
              value={pin}
              onChange={e => { setPin(e.target.value.replace(/\D/g, '').slice(0, 6)); setErr(''); }}
              inputMode="numeric"
              maxLength={6}
              autoFocus
            />
          </div>
          {err && <div className="setup-err">{err}</div>}
          <button type="submit" className="setup-start" disabled={!pin}>► ОРОХ</button>
        </form>
        <div className="setup-hint" style={{ marginTop: 14 }}>
          <button type="button" className="setup-reset-link" onClick={handleReset}>
            PIN мартсан уу? — Бүгдийг сэргээх
          </button>
        </div>
      </div>
    </div>
  );
}

// ============ PROFILE BAR (with presence) ============
function ProfileBar({ couple }) {
  const me = couple.state.users[couple.state.myUserId];
  const partner = couple.state.users[couple.state.myUserId === 'a' ? 'b' : 'a'];
  const netState = couple.netState;

  let presenceLabel, presenceClass;
  if (netState === 'online') { presenceLabel = '● ONLINE'; presenceClass = 'on'; }
  else if (netState === 'waiting' || netState === 'starting') { presenceLabel = '○ ХҮЛЭЭЖ БНА'; presenceClass = 'mid'; }
  else { presenceLabel = '✗ OFFLINE'; presenceClass = 'off'; }

  return (
    <div className="profile-bar">
      <div className="profile-cell me">
        <span className="profile-label">ЧИ</span>
        <span className="profile-name">{me?.name}</span>
      </div>
      <div className="profile-divider">·</div>
      <div className="profile-cell partner">
        <span className="profile-label">ХАМТРАГЧ</span>
        <span className="profile-name">{partner?.name || '—'}</span>
      </div>
      <span className={`presence-badge ${presenceClass}`}>{presenceLabel}</span>
      <span className="pair-badge" title="Хосын код">{couple.state.pairCode || '—'}</span>
      <button
        className="profile-logout"
        onClick={() => { if (window.confirm('Гарах уу?')) couple.logout(); }}
        title="Гарах"
      >↶ Гарах</button>
    </div>
  );

// ============ CUSTOM COUNTERS + ALARMS ============
// User-added time trackers (count-up / count-down) and alarms (one-shot).

const { useState: evUseState, useEffect: evUseEffect, useRef: evUseRef } = React;

const evPad = (n, w = 2) => String(Math.max(0, n)).padStart(w, '0');

function useNowTick(intervalMs = 1000) {
  const [now, setNow] = evUseState(() => new Date());
  evUseEffect(() => {
    const id = setInterval(() => setNow(new Date()), intervalMs);
    return () => clearInterval(id);
  }, [intervalMs]);
  return now;
}

function evBreak(ms) {
  const abs = Math.abs(ms);
  return {
    days: Math.floor(abs / 86400000),
    hours: Math.floor((abs % 86400000) / 3600000),
    min: Math.floor((abs % 3600000) / 60000),
    sec: Math.floor((abs % 60000) / 1000),
    sign: ms < 0 ? -1 : 1,
  };
}

// ============ ALARMS ============
// alarm = { id, title, datetime (ISO), description, sound?: bool }

// Play a multi-beep alarm pattern using Web Audio.
function evPlayAlarmSound() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const playBeep = (delay, freq, dur) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'square';
      o.frequency.value = freq;
      const t = ctx.currentTime + delay;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.28, t + 0.02);
      g.gain.setValueAtTime(0.28, t + dur - 0.05);
      g.gain.linearRampToValueAtTime(0, t + dur);
      o.start(t);
      o.stop(t + dur + 0.02);
    };
    // 6 alternating beeps over ~3 seconds
    for (let i = 0; i < 6; i++) {
      const freq = i % 2 === 0 ? 880 : 1175; // A5 / D6
      playBeep(i * 0.45, freq, 0.28);
    }
    setTimeout(() => { try { ctx.close(); } catch (e) {} }, 4000);
  } catch (e) {}
}

function evFlashTitle(title, originalTitle) {
  let toggle = false;
  let count = 0;
  const id = setInterval(() => {
    document.title = toggle ? originalTitle : `🔔 ${title}`;
    toggle = !toggle;
    count++;
    if (count > 20) {
      clearInterval(id);
      document.title = originalTitle;
    }
  }, 700);
}

function evShowNotification(title, body) {
  if (!('Notification' in window)) return;
  const fire = () => {
    try { new Notification('🔔 ' + title, { body: body || 'Цаг боллоо' }); } catch (e) {}
  };
  if (Notification.permission === 'granted') fire();
  else if (Notification.permission !== 'denied') {
    Notification.requestPermission().then(p => { if (p === 'granted') fire(); });
  }
}

function AlarmsSection({ couple }) {
  const now = useNowTick(1000);
  const [adding, setAdding] = evUseState(false);
  const alarms = couple.state.alarms || [];
  const triggeredRef = evUseRef(new Set());

  // Seed already-past alarms on first render so we don't re-fire history.
  evUseEffect(() => {
    const n = Date.now();
    for (const a of alarms) {
      if (new Date(a.datetime).getTime() <= n - 5000) {
        triggeredRef.current.add(a.id);
      }
    }
    // intentionally only on mount
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Fire when an alarm reaches its time
  evUseEffect(() => {
    const originalTitle = document.title;
    for (const a of alarms) {
      const target = new Date(a.datetime).getTime();
      if (now.getTime() >= target && !triggeredRef.current.has(a.id)) {
        triggeredRef.current.add(a.id);
        evPlayAlarmSound();
        evFlashTitle(a.title, originalTitle);
        evShowNotification(a.title, a.description);
      }
    }
  }, [now, alarms]);

  // Sort: active first (soonest), then triggered
  const sorted = [...alarms].sort((a, b) => new Date(a.datetime) - new Date(b.datetime));

  return (
    <div className="custom-section">
      <div className="custom-head">
        <span className="custom-title">🔔 ДОХИОЛОЛ</span>
        <button className="custom-add" onClick={() => setAdding(true)} title="Шинэ дохиолол нэмэх">

// ============ VINYL PLAYER ============
// YouTube URL playback, mic recording, file upload. Audio-only playback even
// for mp4 (uses a hidden <video> element).
//
// Recordings and uploaded files are persisted locally to IndexedDB so they can
// be replayed across sessions. YouTube items are NOT persisted (per spec).
// IndexedDB stays on the device — audio is too big for the URL-hash share link,
// so each device has its own library.

const { useState: vpUseState, useEffect: vpUseEffect, useRef: vpUseRef } = React;

// ----- IndexedDB helpers -----
const VP_DB_NAME = 'mixtape-vinyl';
const VP_STORE = 'tracks';

function vpOpenDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB not supported')); return; }
    const req = indexedDB.open(VP_DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(VP_STORE)) {
        const store = db.createObjectStore(VP_STORE, { keyPath: 'id' });
        store.createIndex('createdAt', 'createdAt');
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function vpSaveTrack(track) {
  const db = await vpOpenDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(VP_STORE, 'readwrite');
    tx.objectStore(VP_STORE).put(track);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function vpListTracks() {
  const db = await vpOpenDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(VP_STORE, 'readonly');
    const req = tx.objectStore(VP_STORE).getAll();
    req.onsuccess = () => {
      const all = req.result || [];
      all.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      // strip the heavy blob — load on demand
      resolve(all.map(t => ({ id: t.id, kind: t.kind, title: t.title, source: t.source, createdAt: t.createdAt, size: t.blob?.size || 0 })));
    };
    req.onerror = () => reject(req.error);
  });
}

async function vpGetTrack(id) {
  const db = await vpOpenDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(VP_STORE, 'readonly');
    const req = tx.objectStore(VP_STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function vpDeleteTrack(id) {
  const db = await vpOpenDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(VP_STORE, 'readwrite');
    tx.objectStore(VP_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function vpMakeId() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}

function vpFmtBytes(b) {
  if (!b) return '';
  if (b < 1024) return b + 'B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + 'KB';
  return (b / 1024 / 1024).toFixed(1) + 'MB';
}

function vpFmtWhen(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function vpParseYouTubeId(input) {
  if (!input) return null;
  const trimmed = input.trim();
  if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
  try {
    const u = new URL(trimmed.startsWith('http') ? trimmed : 'https://' + trimmed);
    if (u.hostname.includes('youtube.com') || u.hostname === 'm.youtube.com') {
      const v = u.searchParams.get('v');
      if (v && /^[a-zA-Z0-9_-]{11}$/.test(v)) return v;
      const m = u.pathname.match(/\/(embed|shorts|v|live)\/([a-zA-Z0-9_-]{11})/);
      if (m) return m[2];
    }
    if (u.hostname === 'youtu.be') {
      const m = u.pathname.match(/^\/([a-zA-Z0-9_-]{11})/);
      if (m) return m[1];
    }
  } catch (e) {}
  return null;
}

let vpYTApiPromise = null;
function vpLoadYouTubeAPI() {
  if (vpYTApiPromise) return vpYTApiPromise;
  vpYTApiPromise = new Promise((resolve) => {
    if (window.YT && window.YT.Player) { resolve(window.YT); return; }
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => {
      if (typeof prev === 'function') prev();
      resolve(window.YT);
    };
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  });
  return vpYTApiPromise;
}

const vpFmtTime = (s) => {
  if (!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s / 60);
  const r = Math.floor(s % 60);
  return `${m}:${String(r).padStart(2, '0')}`;
};

function VinylPlayer() {
  const [tab, setTab] = vpUseState('youtube'); // 'youtube' | 'record' | 'upload' | 'library'
  const [source, setSource] = vpUseState(null); // { kind, title, ytId?, url?, trackId? }
  const [playing, setPlaying] = vpUseState(false);
  const [volume, setVolume] = vpUseState(0.75);
  const [pos, setPos] = vpUseState(0);
  const [dur, setDur] = vpUseState(0);

  const [ytInput, setYtInput] = vpUseState('');
  const [ytTitleInput, setYtTitleInput] = vpUseState('');
  const [ytError, setYtError] = vpUseState('');
  const [ytLoading, setYtLoading] = vpUseState(false);

  const [recording, setRecording] = vpUseState(false);
  const [recordError, setRecordError] = vpUseState('');
  const [recordSeconds, setRecordSeconds] = vpUseState(0);
  const recorderRef = vpUseRef(null);
  const recordChunksRef = vpUseRef([]);
  const recordTimerRef = vpUseRef(null);
  const recordStreamRef = vpUseRef(null);

  const mediaRef = vpUseRef(null);
  const ytPlayerRef = vpUseRef(null);

  // Persistent library (IndexedDB)
  const [library, setLibrary] = vpUseState([]);
  const [libError, setLibError] = vpUseState('');

  // Real-time sync: when applying a remote update, don't echo back
  const remoteUpdateRef = vpUseRef(false);
  const broadcast = (msg) => {
    if (remoteUpdateRef.current) return;
    if (window.CoupleNet && window.CoupleNet.state === 'online') {
      try { window.CoupleNet.send(msg); } catch (e) {}
    }
  };

  const reloadLibrary = async () => {
    try {
      const tracks = await vpListTracks();
      setLibrary(tracks);
    } catch (e) { setLibError(String(e.message || e)); }
  };

  vpUseEffect(() => { reloadLibrary(); }, []);

  // Listen for incoming tracks from partner via CoupleNet
  vpUseEffect(() => {
    const handler = async (e) => {
      try {
        const detail = e.detail || {};
        const t = detail.track || {};
        if (!t.id || !detail.data) return;
        const exists = await vpGetTrack(t.id);
        if (exists) return; // already have it
        const blob = new Blob([detail.data], { type: t.mime || 'audio/webm' });
        await vpSaveTrack({
          id: t.id,
          kind: 'audio',
          title: t.title || 'Дуу',
          source: 'received',
          blob,
          createdAt: t.createdAt || Date.now(),
        });
        await reloadLibrary();
      } catch (err) { console.warn('incoming track failed', err); }
    };
    window.addEventListener('couple:track', handler);
    return () => window.removeEventListener('couple:track', handler);
  }, []);

  // Listen for remote vinyl playback events (real-time sync from partner)
  vpUseEffect(() => {
    const handler = async (e) => {
      const m = e.detail;
      if (!m) return;
      remoteUpdateRef.current = true;
      try {
        if (m.type === 'vinyl-source') {
          const src = m.source || {};
          if (src.kind === 'youtube' && src.ytId) {
            setSource({ kind: 'youtube', ytId: src.ytId, title: src.title || 'YouTube ая' });
            setPos(0); setDur(0); setPlaying(false);
          } else if (src.kind === 'audio' && src.trackId) {
            const t = await vpGetTrack(src.trackId);
            if (t && t.blob) {
              const url = URL.createObjectURL(t.blob);
              setSource({ kind: 'audio', url, title: t.title, trackId: t.id });
              setPos(0); setDur(0); setPlaying(false);
            } else {
              window.cpToast && window.cpToast({
                kind: 'queued',
                text: '♪ Хамтрагч "' + (src.title || 'дуу') + '"-г тоглуулж байна — танд файл байхгүй. Илгээхийг хүс.',
              });
            }
          }
        } else if (m.type === 'vinyl-play') {
          await applyRemotePlayPause(true, m.pos || 0);
        } else if (m.type === 'vinyl-pause') {
          await applyRemotePlayPause(false, m.pos || 0);
        } else if (m.type === 'vinyl-seek') {
          await applyRemoteSeek(m.pos || 0);
        } else if (m.type === 'vinyl-stop') {
          await applyRemoteStop();
        }
      } catch (err) { console.warn('vinyl remote failed', err); }
      finally {
        setTimeout(() => { remoteUpdateRef.current = false; }, 500);
      }
    };
    window.addEventListener('couple:vinyl', handler);
    return () => window.removeEventListener('couple:vinyl', handler);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [source]);

  const applyRemotePlayPause = async (play, pos) => {
    if (source?.kind === 'youtube') {
      const p = ytPlayerRef.current;
      if (!p) return;
      try {
        if (typeof pos === 'number' && pos > 0) p.seekTo(pos, true);
        if (play) p.playVideo(); else p.pauseVideo();
      } catch (_) {}
    } else if (source?.kind === 'audio') {
      const el = mediaRef.current;
      if (!el) return;
      try {
        if (typeof pos === 'number' && pos >= 0) el.currentTime = pos;
        if (play) await el.play(); else el.pause();
      } catch (_) {}
    }
  };

  const applyRemoteSeek = async (pos) => {
    if (source?.kind === 'youtube') {
      const p = ytPlayerRef.current;
      if (p) { try { p.seekTo(pos, true); } catch (_) {} }

      const el = mediaRef.current;
      if (el) { try { el.currentTime = pos; } catch (_) {} }

  const applyRemoteStop = async () => {

      if (el) { el.pause(); el.currentTime = 0; }

    setPos(0);
  };

  const sendTrackToPartner = async (id) => {

        type: 'track',
        track: {
          id: t.id,
          title: t.title,
          source: t.source,
          createdAt: t.createdAt,
          mime: t.blob.type || 'audio/webm',
        },
        data,
      });
      window.cpToast && window.cpToast({
        kind: ok ? 'track' : 'queued',

      console.warn(e);
      window.cpToast && window.cpToast({ kind: 'queued', text: '✗ Алдаа: ' + (e.message || e) });

  const playFromLibrary = async (id) => {

      const t = await vpGetTrack(id);
      if (!t || !t.blob) return;
      const url = URL.createObjectURL(t.blob);
      setSource({ kind: 'audio', url, title: t.title, trackId: t.id });
      setPos(0); setDur(0); setPlaying(false);
      broadcast({ type: 'vinyl-source', source: { kind: 'audio', trackId: t.id, title: t.title } });
    } catch (e) { setLibError(String(e.message || e)); }

  const removeFromLibrary = async (id) => {

      await vpDeleteTrack(id);

    try { await vpSaveTrack(track); } catch (e) { setLibError(String(e.message || e)); }

  };

  // Apply volume
  vpUseEffect(() => {
    if (mediaRef.current) mediaRef.current.volume = volume;

      yt.setVolume(Math.round(volume * 100));
    }

  // YouTube player setup / teardown
  vpUseEffect(() => {

      setYtLoading(true);

              try { setDur(e.target.getDuration() || 0); } catch (err) {}
            },

    } else {
      if (ytPlayerRef.current && ytPlayerRef.current.destroy) {

    const onPause = () => setPlaying(false);
    const onEnded = () => { setPlaying(false); setPos(0); };
    el.addEventListener('timeupdate', onTime);
    el.addEventListener('loadedmetadata', onMeta);
    el.addEventListener('durationchange', onMeta);
    el.addEventListener('play', onPlay);
    el.addEventListener('pause', onPause);
    el.addEventListener('ended', onEnded);
    return () => {
      el.removeEventListener('timeupdate', onTime);
      el.removeEventListener('loadedmetadata', onMeta);
      el.removeEventListener('durationchange', onMeta);
      el.removeEventListener('play', onPlay);
      el.removeEventListener('pause', onPause);
      el.removeEventListener('ended', onEnded);

    } else {

      if (!el) return;
      if (playing) el.pause(); else el.play().catch(() => {});

    if (!source) return;
    if (source.kind === 'youtube') {
      const p = ytPlayerRef.current;

    } else {

      const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);

      rec.ondataavailable = (ev) => { if (ev.data && ev.data.size) recordChunksRef.current.push(ev.data); };
      rec.onstop = async () => {
        const blob = new Blob(recordChunksRef.current, { type: mime || 'audio/webm' });
        const now = new Date();
        const stamp = `${now.getFullYear()}.${vpPad2(now.getMonth() + 1)}.${vpPad2(now.getDate())} ${vpPad2(now.getHours())}:${vpPad2(now.getMinutes())}`;
        await saveAndUse({ blob, title: `Дуу хоолой · ${stamp}`, source: 'record' });
        setRecording(false);
        if (recordTimerRef.current) clearInterval(recordTimerRef.current);
        setRecordSeconds(0);
        if (recordStreamRef.current) {
          recordStreamRef.current.getTracks().forEach(t => t.stop());
          recordStreamRef.current = null;
        }
      };
      rec.start();
      recorderRef.current = rec;
      setRecording(true);
      setRecordSeconds(0);
      recordTimerRef.current = setInterval(() => setRecordSeconds(s => s + 1), 1000);
    } catch (err) {
      setRecordError('Микрофон зөвшөөрөгдсөнгүй: ' + (err.message || err));
    }
  };

  const stopRecord = () => {
    const rec = recorderRef.current;
    if (rec && rec.state !== 'inactive') {
      try { rec.stop(); } catch (e) {}
    }
    recorderRef.current = null;
  };

  const searchYT = (e) => {
    e.preventDefault();
    const q = ytInput.trim() || 'mongolian songs';
    window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`, '_blank', 'noopener,noreferrer');
  };

  return (
    <div className="vinyl-card">
      <div className="vinyl-deck">
        <div className="vinyl-platter-wrap">
          <div className={`vinyl-platter ${playing ? 'spinning' : ''}`}>
            <VinylRecord title={source?.title} kind={source?.kind}/>
          </div>
          <div className={`tonearm-wrap ${playing ? 'on' : 'off'}`}>
            <Tonearm/>
          </div>
          <button
            className="vinyl-play-btn"
            onClick={togglePlay}
            disabled={!source || ytLoading}
            title={!source ? 'Эхлээд ая сонгоно уу' : (playing ? 'Зогсоох' : 'Тоглуулах')}
          >
            {ytLoading ? '…' : (playing ? '❚❚' : '▶')}
          </button>
        </div>

        <div className="vinyl-track-info">
          <div className="now">
            {ytLoading ? '◌ ЛОДЛОЖ БАЙНА...' : source ? (playing ? '▶ ОДОО ТОГЛОЖ БАЙНА' : '❚❚ ПАУЗ') : 'АЯ СОНГОНО УУ'}
          </div>
          <div className="title">{source?.title || '—'}</div>
          <div className="time">{vpFmtTime(pos)} / {vpFmtTime(dur)}</div>
        </div>

        <div className="vinyl-progress">
          <div className="bar" style={{ width: dur ? `${Math.min(100, (pos / dur) * 100)}%` : '0%' }}/>
        </div>

        <div className="vinyl-bottom">
          <div className="vol">
            <span>VOL</span>
            <input
              type="range" min="0" max="100"
              value={Math.round(volume * 100)}
              onChange={e => setVolume(Number(e.target.value) / 100)}
            />
            <span>{Math.round(volume * 100)}</span>
          </div>
          <button className="vinyl-stop-btn" onClick={stop} disabled={!source}>■ STOP</button>
        </div>
      </div>

      <div className="vinyl-source">
        <div className="vinyl-tabs">
          <button className={tab === 'youtube' ? 'active' : ''} onClick={() => setTab('youtube')}>📺 YouTube</button>
          <button className={tab === 'record' ? 'active' : ''} onClick={() => setTab('record')}>🎙️ Бичих</button>
          <button className={tab === 'upload' ? 'active' : ''} onClick={() => setTab('upload')}>📁 Файл</button>
          <button className={tab === 'library' ? 'active' : ''} onClick={() => { setTab('library'); reloadLibrary(); }}>📚 Сан {library.length > 0 ? `(${library.length})` : ''}</button>
        </div>

        {tab === 'youtube' && (
          <form className="vinyl-tabpane" onSubmit={handleYTLoad}>
            <label>YouTube холбоос:</label>
            <input
              type="text"
              placeholder="https://youtube.com/watch?v=..."
              value={ytInput}
              onChange={e => setYtInput(e.target.value)}
            />
            <label>Дууны нэр (заавал биш):</label>
            <input
              type="text"
              placeholder="Жнь: Бидний дуу"
              value={ytTitleInput}
              onChange={e => setYtTitleInput(e.target.value)}
            />
            {ytError && <div className="err">{ytError}</div>}
            <div className="row-buttons">
              <button type="submit">↺ ПЯНЗ ДЭЭР ТАВИХ</button>
              <a href="#" onClick={searchYT}>🔍 YOUTUBE-ААС ХАЙХ</a>
            </div>
          </form>
        )}

        {tab === 'record' && (
          <div className="vinyl-tabpane">
            <label>Өөрийн дуу хоолой бичих:</label>
            {!recording ? (
              <button className="big-btn" onClick={startRecord}>● БИЧИЖ ЭХЛЭХ</button>
            ) : (
              <button className="big-btn active" onClick={stopRecord}>■ ЗОГСООХ · {vpFmtTime(recordSeconds)}</button>
            )}
            {recordError && <div className="err">{recordError}</div>}
            <div className="hint">Browser микрофоны зөвшөөрөл асууна. Бичсэн дуу хоолой шууд пянз дээр тавигдана.</div>
          </div>
        )}

        {tab === 'upload' && (
          <div className="vinyl-tabpane">
            <label>Аудио / Видео файл:</label>
            <input
              type="file"
              accept="audio/*,video/*,.mp3,.mp4,.m4a,.wav,.webm,.ogg,.aac"
              onChange={handleFileUpload}
            />
            <div className="hint">
              MP3, MP4, WAV, M4A зэрэг файл болно. MP4 видео оруулсан ч аудиог нь л тоглоно.
              Файл "Сан" доор автоматаар хадгалагдана.
            </div>
          </div>
        )}

        {tab === 'library' && (
          <div className="vinyl-tabpane">
            <label>📚 Хадгалсан бичлэгүүд</label>
            {libError && <div className="err">{libError}</div>}
            {library.length === 0 ? (
              <div className="hint">
                Сан хоосон байна. "🎙️ Бичих" эсвэл "📁 Файл" хэсгээр шинэ бичлэг нэмбэл энд автоматаар хадгалагдана.
              </div>
            ) : (
              <ul className="vinyl-library">
                {library.map(t => (
                  <li key={t.id} className={`lib-item ${source?.trackId === t.id ? 'playing' : ''}`}>
                    <div className="lib-info">
                      <div className="lib-title">
                        {t.source === 'record' ? '🎙️' : '📁'} {t.title}
                      </div>
                      <div className="lib-meta">{vpFmtWhen(t.createdAt)} · {vpFmtBytes(t.size)}</div>
                    </div>
                    <div className="lib-actions">
                      <button type="button" className="lib-btn" onClick={() => playFromLibrary(t.id)}>▶ Тавих</button>
                      <button
                        type="button"
                        className="lib-btn send"
                        onClick={() => sendTrackToPartner(t.id)}
                        title="Хамтрагч руу илгээх (online үед)"
                      >↗ Илгээх</button>
                      <button type="button" className="lib-btn del" onClick={() => removeFromLibrary(t.id)}>×</button>
                    </div>
                  </li>
                ))}
              </ul>
            )}
            <div className="hint">
              Бичлэгүүд browser-ийн IndexedDB-д хадгалагдана. "↗ Илгээх" товчоор
              хамтрагч руу real-time илгээж болно (хоёулаа online үед). Том файл
              удаан очно — хязгаар ~8MB зөвлөгдөж байна.
            </div>
          </div>
        )}
      </div>

      {/* Hidden media element for audio/recording/upload */}
      <video
        ref={mediaRef}
        src={source?.kind === 'audio' ? source.url : ''}
        style={{ display: 'none' }}
        playsInline
        preload="metadata"
      />

      {/* Hidden YouTube host */}
      <div
        id="vinyl-yt-host"
        style={{ position: 'absolute', left: '-9999px', top: '-9999px', width: '320px', height: '180px' }}
        aria-hidden="true"
      />
    </div>
  );
}

function MongoliaMap({ meName = '', partnerName = '' }) {
  // Projection: lon-lat -> SVG x-y
  const LON_MIN = 87,LAT_MAX = 52,LAT_MIN = 41,LON_MAX = 120;
  const PAD = 30,SCALE = 22;
  const COS_REF = Math.cos(46 * Math.PI / 180);
  const proj = (lon, lat) => [
  (lon - LON_MIN) * COS_REF * SCALE + PAD,
  (LAT_MAX - lat) * SCALE + PAD];

  const VB_W = (LON_MAX - LON_MIN) * COS_REF * SCALE + 2 * PAD;
  const VB_H = (LAT_MAX - LAT_MIN) * SCALE + 2 * PAD;

  const pathFromLatLon = (pts) =>
  'M ' + pts.map((p) => proj(p[0], p[1]).map((n) => n.toFixed(1)).join(' ')).join(' L ') + ' Z';

  const polylineFromLatLon = (pts) =>
  pts.map((p) => proj(p[0], p[1]).map((n) => n.toFixed(1)).join(',')).join(' ');

  const mongoliaPath = pathFromLatLon(MN_BORDER);
  const khovsgolPath = pathFromLatLon(KHOVSGOL_BORDER);
  const highwayPoints = polylineFromLatLon(HIGHWAY);

  const [uX, uY] = proj(106.92, 47.92);
  const [dX, dY] = proj(104.42, 43.57);
  const midX = (uX + dX) / 2;
  const midY = (uY + dY) / 2;

  const renderPin = (x, y, color, title, sub, labelSide) => {
    const lx = labelSide === 'left' ? x - 14 : x + 14;
    const anchor = labelSide === 'left' ? 'end' : 'start';
    return (
      <g key={title}>
        {/* shadow */}
        <ellipse cx={x} cy={y + 2} rx="5" ry="2" fill="rgba(0,0,0,0.22)" />
        {/* pin body */}
        <g className="pin">
          <path
            d={`M ${x} ${y} C ${x - 2} ${y - 4} ${x - 9} ${y - 10} ${x - 9} ${y - 15}
                A 9 9 0 1 1 ${x + 9} ${y - 15}
                C ${x + 9} ${y - 10} ${x + 2} ${y - 4} ${x} ${y} Z`}
            fill={color}
            stroke="#a52714"
            strokeOpacity="0.5"
            strokeWidth="0.8" />

          <circle cx={x} cy={y - 15} r="3.5" fill="#fff" />
        </g>
        {/* label with white halo */}
        <text x={lx} y={y - 6}
        fontFamily="Roboto, sans-serif" fontSize="13" fontWeight="700"
        fill="#202124" textAnchor={anchor}
        stroke="#fff" strokeWidth="3.5" paintOrder="stroke">
          {title}
        </text>
        <text x={lx} y={y + 9}
        fontFamily="Roboto, sans-serif" fontSize="11" fontWeight="500"
        fill="#5f6368" textAnchor={anchor}
        stroke="#fff" strokeWidth="3" paintOrder="stroke">
          {sub}
        </text>
      </g>);

  };

  return (
    <div className="map-card">
      <div className="map-toolbar">
        <div className="map-search">
          <span className="gicon">🔍</span>
          <span className="route">
            <span className="from">Даланзадгад</span>
            <span className="arr">→</span>
            <span className="to">Улаанбаатар</span>
          </span>
        </div>
        <div className="map-route-pill">8 ц 540 км</div>
      </div>

      <div className="map-svg-wrap">
        <svg viewBox={`0 0 ${VB_W} ${VB_H}`} className="map-svg"
        preserveAspectRatio="xMidYMid meet"
        xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="hatchSurround" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(0,0,0,0.025)" strokeWidth="1" />
            </pattern>
            <filter id="pinShadow" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="1" stdDeviation="1" floodOpacity="0.3" />
            </filter>
          </defs>

          {/* Off-Mongolia base */}
          <rect x="0" y="0" width={VB_W} height={VB_H} fill="#e8e6e1" />
          <rect x="0" y="0" width={VB_W} height={VB_H} fill="url(#hatchSurround)" />

          {/* Surrounding country labels */}
          <text x={VB_W / 2} y={VB_H - 10} fontFamily="Roboto, sans-serif" fontSize="13" fill="#9aa0a6" fontWeight="500" textAnchor="middle" letterSpacing="3">БҮГД НАЙРАМДАХ ХЯТАД АРД УЛС</text>
          <text x={26} y={VB_H * 0.55} fontFamily="Roboto, sans-serif" fontSize="11" fill="#bdc1c6" fontWeight="500" letterSpacing="2">КАЗАХСТАН</text>

          {/* Mongolia */}
          <path d={mongoliaPath} fill="#f7f3e8" stroke="#bdbdbd" strokeWidth="1.3" strokeLinejoin="round" />

          {/* Lake Khövsgöl */}
          <path d={khovsgolPath} fill="#a5cff0" stroke="#7fb7df" strokeWidth="0.8" />
          <text x={proj(99.5, 51.0)[0]} y={proj(99.5, 51.0)[1]} fontFamily="Roboto, sans-serif" fontSize="9" fill="#4a7fb0" fontStyle="italic" textAnchor="end">Хөвсгөл нуур</text>

          {/* Gobi label */}
          <text x={proj(107, 43.4)[0]} y={proj(107, 43.4)[1]}
          fontFamily="Roboto, sans-serif" fontSize="12" fill="#a08c5a"
          fontStyle="italic" textAnchor="middle" letterSpacing="3"
          stroke="#f7f3e8" strokeWidth="3" paintOrder="stroke">
            ГОВЬ
          </text>

          {/* Other cities */}
          {OTHER_CITIES.map((c, i) => {
            const [x, y] = proj(c.lon, c.lat);
            return (
              <g key={i}>
                <circle cx={x} cy={y} r="2" fill="#9aa0a6" stroke="#fff" strokeWidth="0.8" />
                <text x={x + 5} y={y + 3.5}
                fontFamily="Roboto, sans-serif" fontSize="10" fill="#5f6368"
                stroke="#f7f3e8" strokeWidth="2.5" paintOrder="stroke">
                  {c.name}
                </text>
              </g>);

          })}

          {/* Highway underlay (casing) */}
          <polyline points={highwayPoints} fill="none" stroke="#e1a83a" strokeWidth="5.5" strokeLinejoin="round" strokeLinecap="round" />
          {/* Highway main */}
          <polyline points={highwayPoints} fill="none" stroke="#fad26d" strokeWidth="3.5" strokeLinejoin="round" strokeLinecap="round" />

          {/* Midpoint marker */}
          <g transform={`translate(${midX - 11}, ${midY - 11})`}>
            <circle cx="11" cy="11" r="11" fill="#fff" stroke="#1a73e8" strokeWidth="1.5" filter="url(#pinShadow)" />
            <text x="11" y="15" textAnchor="middle" fontFamily="Roboto, sans-serif" fontSize="11" fontWeight="700" fill="#1a73e8">★</text>
          </g>

          {/* Pins (drawn last so labels are on top) */}
          {renderPin(uX, uY, '#ea4335', 'Улаанбаатар', partnerName || '', 'right')}
          {renderPin(dX, dY, '#4285f4', 'Даланзадгад', meName || '', 'right')}

        </svg>

        <div className="map-zoom">
          <button aria-label="zoom in">+</button>
          <button aria-label="zoom out">−</button>
        </div>

        <div className="map-distance-pill">
          <span className="dot"></span>
          <span>Зай <b>≈ 540 км</b></span>
        </div>

        <div className="map-attribution">map © mixtape</div>
      </div>

      <div className="map-foot">
        <div className="cell"><b>Зай</b>≈ 540 км</div>
        <div className="cell"><b>Машинаар</b>≈ 8 цаг</div>
        <div className="cell"><b>Нислэгээр</b>≈ 1 цаг</div>
      </div>
    </div>);

}

function Root() {
  const couple = useCouple();

  // First time -> setup (pair code + name + PIN)
  if (!couple.state.setupAt) {
    return (
      <>
        <CoupleSetup
          state={couple.state}
          onComplete={(data) => couple.completeSetup(data)} />
        <ToastContainer />
      </>);
  }

  // Logged out -> require PIN to re-enter
  if (!couple.state.isLoggedIn) {
    return (
      <>
        <CoupleLogin
          state={couple.state}
          onLogin={couple.login}
          onReset={couple.resetAll} />
        <ToastContainer />
      </>);
  }

  return (
    <>
      <ProfileBar couple={couple} />
      <App couple={couple} />
      <ToastContainer />
    </>);

}
